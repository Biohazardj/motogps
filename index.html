<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoGPS V13.2</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #111;
  color: white;
  padding: 20px 12px;
}

input {
  width: 88%;
  max-width: 360px;
  padding: 15px;
  margin: 8px auto;
  font-size: 17px;
  border-radius: 10px;
  border: none;
  display: block;
}

button {
  display: block;
  width: 92%;
  max-width: 390px;
  margin: 12px auto;
  padding: 17px;
  font-size: 17px;
  border: none;
  border-radius: 12px;
  color: white;
}

#connect { background: #2196F3; }
#gps { background: #ff9800; }
#route { background: #9c27b0; }
#navigate { background: #00a86b; }
#stop { background: #d32f2f; }

#status,
#gpsdata,
#routedata,
#navdata {
  max-width: 400px;
  margin: 15px auto;
  line-height: 1.55;
}

#gpsdata {
  color: #7CFC98;
}

#navdata {
  text-align: left;
  background: #222;
  padding: 17px;
  border-radius: 12px;
  font-size: 17px;
}
</style>
</head>

<body>

<h1>🏍️ MotoGPS V13.2</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">
ESP32 desconectado
</div>

<hr>

<button id="gps" onclick="activarGPS()">
1️⃣ ACTIVAR GPS
</button>

<div id="gpsdata">
GPS desactivado
</div>

<hr>

<h2>Destino</h2>

<input
  id="destino"
  type="text"
  placeholder="Ej: Catedral de León"
>

<button id="route" onclick="calcularRuta()">
2️⃣ CALCULAR RUTA
</button>

<div id="routedata">
Sin ruta
</div>

<button id="navigate" onclick="iniciarNavegacion()">
3️⃣ ▶ INICIAR NAVEGACIÓN
</button>

<button id="stop" onclick="detenerNavegacion()">
■ DETENER
</button>

<div id="navdata">
Esperando navegación
</div>


<script>

/* ======================================
   BLE
====================================== */

const SERVICE_UUID =
"12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-ba0987654321";

let characteristic = null;


/* ======================================
   GPS
====================================== */

let watchId = null;

let latActual = null;
let lonActual = null;
let velocidadActual = 0;
let precisionActual = null;


/* ======================================
   V13.2 - DIAGNÓSTICO Y VELOCIDAD
====================================== */

let contadorGPS = 0;
let velocidadCalculada = 0;
let fuenteVelocidad = "Sin datos";

/*
  Punto de referencia para calcular
  movimiento durante varios segundos.
*/

let latReferencia = null;
let lonReferencia = null;
let tiempoReferencia = null;
let precisionReferencia = null;

/*
  Esperamos al menos 3 segundos antes
  de calcular una nueva velocidad.
*/

const INTERVALO_VELOCIDAD = 3000;


/* ======================================
   RUTA
====================================== */

let pasosRuta = [];
let puntosRuta = [];
let maniobras = [];

let indiceRutaActual = 0;
let indiceManiobra = 0;

let navegando = false;

let ultimaManiobraEnviada = -1;
let ultimaDistanciaEnviada = null;
let ultimaVelocidadEnviada = null;


/* ======================================
   BLUETOOTH
====================================== */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [{ name: "MotoGPS" }],
        optionalServices: [SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}


/* ======================================
   ENVÍO BLE
====================================== */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error.message;

    return false;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* ======================================
   ACTIVAR GPS
====================================== */

function activarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
      "❌ GPS no disponible";

    return;
  }


  document.getElementById("gpsdata").innerText =
    "🛰️ Buscando posición...";


  if (watchId !== null) {

    navigator.geolocation.clearWatch(watchId);
  }


  contadorGPS = 0;
  velocidadActual = 0;
  velocidadCalculada = 0;
  fuenteVelocidad = "Sin datos";

  latReferencia = null;
  lonReferencia = null;
  tiempoReferencia = null;
  precisionReferencia = null;


  watchId =
    navigator.geolocation.watchPosition(

      recibirPosicion,

      errorGPS,

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}


/* ======================================
   NUEVA POSICIÓN GPS
====================================== */

async function recibirPosicion(pos) {

  const nuevaLat =
    pos.coords.latitude;

  const nuevaLon =
    pos.coords.longitude;

  const ahora =
    Date.now();


  contadorGPS++;


  latActual =
    nuevaLat;

  lonActual =
    nuevaLon;

  precisionActual =
    pos.coords.accuracy;


  /*
    ------------------------------------------------
    1. VELOCIDAD NATIVA DEL IPHONE
    ------------------------------------------------
  */

  let velocidadIphone = null;


  if (
    pos.coords.speed !== null &&
    Number.isFinite(pos.coords.speed) &&
    pos.coords.speed > 0
  ) {

    velocidadIphone =
      pos.coords.speed * 3.6;
  }


  /*
    ------------------------------------------------
    2. VELOCIDAD CALCULADA
    ------------------------------------------------

    No usamos dos posiciones consecutivas.

    Conservamos una posición de referencia
    durante varios segundos para que pequeños
    saltos del GPS no parezcan movimiento.
  */

  if (
    latReferencia === null ||
    lonReferencia === null ||
    tiempoReferencia === null
  ) {

    latReferencia =
      nuevaLat;

    lonReferencia =
      nuevaLon;

    tiempoReferencia =
      ahora;

    precisionReferencia =
      precisionActual;

    velocidadCalculada = 0;
  }

  else {

    const tiempoTranscurrido =
      ahora - tiempoReferencia;


    if (
      tiempoTranscurrido >=
      INTERVALO_VELOCIDAD
    ) {

      const distancia =
        distanciaMetros(

          latReferencia,
          lonReferencia,

          nuevaLat,
          nuevaLon
        );


      const segundos =
        tiempoTranscurrido / 1000;


      /*
        Margen de ruido GPS.

        Usamos la mejor de las dos precisiones
        y exigimos además un mínimo de 8 metros.

        Ejemplo:

        precisión actual 24 m
        referencia 20 m

        margen = 20 m

        Un salto menor no se interpreta
        automáticamente como movimiento.
      */

      let margenRuido =
        Math.min(
          Number.isFinite(precisionReferencia)
            ? precisionReferencia
            : 999,

          Number.isFinite(precisionActual)
            ? precisionActual
            : 999
        );


      if (!Number.isFinite(margenRuido)) {

        margenRuido = 8;
      }


      margenRuido =
        Math.max(
          8,
          margenRuido
        );


      /*
        Si el desplazamiento no supera
        claramente el margen GPS,
        consideramos que seguimos parados.
      */

      if (
        Number.isFinite(distancia) &&
        distancia > margenRuido
      ) {

        velocidadCalculada =
          (distancia / segundos) * 3.6;

      } else {

        velocidadCalculada = 0;
      }


      /*
        Nueva referencia para el siguiente
        periodo de cálculo.
      */

      latReferencia =
        nuevaLat;

      lonReferencia =
        nuevaLon;

      tiempoReferencia =
        ahora;

      precisionReferencia =
        precisionActual;
    }
  }


  /*
    ------------------------------------------------
    3. ELEGIR VELOCIDAD
    ------------------------------------------------

    Preferimos siempre la velocidad nativa
    del iPhone si realmente existe.

    Si Bluefy/iPhone no la proporciona,
    utilizamos la calculada.
  */

  if (
    velocidadIphone !== null &&
    velocidadIphone >= 0 &&
    velocidadIphone <= 200
  ) {

    velocidadActual =
      Math.round(
        velocidadIphone
      );

    fuenteVelocidad =
      "iPhone";

  }

  else if (
    Number.isFinite(velocidadCalculada) &&
    velocidadCalculada >= 0 &&
    velocidadCalculada <= 200
  ) {

    velocidadActual =
      Math.round(
        velocidadCalculada
      );

    fuenteVelocidad =
      "Calculada";

  }

  else {

    velocidadActual = 0;

    fuenteVelocidad =
      "Sin datos";
  }


  /*
    ------------------------------------------------
    INFORMACIÓN GPS
    ------------------------------------------------
  */

  document.getElementById("gpsdata").innerHTML =

    "📍 GPS ACTIVO" +

    "<br>Lat: " +
    latActual.toFixed(6) +

    "<br>Lon: " +
    lonActual.toFixed(6) +

    "<br>Precisión: " +
    Math.round(precisionActual) +
    " m" +

    "<br>Velocidad: " +
    velocidadActual +
    " km/h" +

    "<br>Fuente velocidad: " +
    fuenteVelocidad +

    "<br>Actualizaciones GPS: " +
    contadorGPS;


  /*
    NAVEGACIÓN V13 SIN CAMBIOS
  */

  if (navegando) {

    await actualizarNavegacionGPS();
  }
}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
    "❌ GPS: " + error.message;
}


/* ======================================
   GEOCODIFICAR DESTINO
====================================== */

async function buscarDestino(texto) {

  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&limit=1" +

    "&countrycodes=es" +

    "&q=" +

    encodeURIComponent(texto);


  const respuesta =
    await fetch(url);


  if (!respuesta.ok) {

    throw new Error(
      "Error buscando destino"
    );
  }


  const datos =
    await respuesta.json();


  if (!datos.length) {

    throw new Error(
      "Destino no encontrado"
    );
  }


  return {

    lat: Number(datos[0].lat),

    lon: Number(datos[0].lon),

    nombre:
      datos[0].display_name
  };
}


/* ======================================
   CALCULAR RUTA
====================================== */

async function calcularRuta() {

  if (
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    alert(
      "Primero activa el GPS y espera a tener posición."
    );

    return;
  }


  const texto =
    document
      .getElementById("destino")
      .value
      .trim();


  if (!texto) {

    alert(
      "Escribe un destino."
    );

    return;
  }


  document.getElementById("routedata").innerText =
    "🔎 Buscando destino...";


  try {

    const destino =
      await buscarDestino(texto);


    document.getElementById("routedata").innerText =
      "🌐 Calculando ruta...";


    const url =

      "https://router.project-osrm.org/route/v1/driving/" +

      lonActual + "," +
      latActual + ";" +

      destino.lon + "," +
      destino.lat +

      "?overview=full" +
      "&geometries=geojson" +
      "&steps=true";


    const respuesta =
      await fetch(url);


    if (!respuesta.ok) {

      throw new Error(
        "Error OSRM " +
        respuesta.status
      );
    }


    const datos =
      await respuesta.json();


    if (
      datos.code !== "Ok" ||
      !datos.routes ||
      !datos.routes.length
    ) {

      throw new Error(
        "No se pudo calcular la ruta"
      );
    }


    pasosRuta =
      datos.routes[0]
        .legs[0]
        .steps;


    const geometria =
      datos.routes[0]
        .geometry
        .coordinates;


    puntosRuta =
      densificarGeometria(
        geometria,
        5
      );


    construirIndiceManiobras();


    indiceRutaActual = 0;

    indiceManiobra = 0;


    if (
      maniobras.length > 1 &&
      maniobras[0]
        .paso
        .maneuver
        .type === "depart"
    ) {

      indiceManiobra = 1;
    }


    ultimaManiobraEnviada = -1;
    ultimaDistanciaEnviada = null;
    ultimaVelocidadEnviada = null;


    const distanciaKm =
      datos.routes[0].distance / 1000;


    const minutos =
      datos.routes[0].duration / 60;


    document.getElementById("routedata").innerHTML =

      "✅ RUTA CARGADA" +

      "<br>" +

      destino.nombre +

      "<br><br>Distancia: " +

      distanciaKm.toFixed(1) +
      " km" +

      "<br>Tiempo OSRM: " +

      Math.round(minutos) +
      " min" +

      "<br>Maniobras: " +

      maniobras.length +

      "<br>Puntos: " +

      puntosRuta.length;


    localizarEnRuta();

    actualizarPantallaWeb();

  } catch (error) {

    document.getElementById("routedata").innerHTML =

      "❌ ERROR<br>" +
      error.message;
  }
}


/* ======================================
   DENSIFICAR GEOMETRÍA
====================================== */

function densificarGeometria(
  geometria,
  separacion
) {

  const resultado = [];


  for (
    let i = 0;
    i < geometria.length - 1;
    i++
  ) {

    const a = geometria[i];
    const b = geometria[i + 1];


    resultado.push(a);


    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );


    if (!Number.isFinite(d))
      continue;


    const partes =
      Math.max(
        1,
        Math.ceil(
          d / separacion
        )
      );


    for (
      let j = 1;
      j < partes;
      j++
    ) {

      const t =
        j / partes;


      resultado.push([

        a[0] +
        (b[0] - a[0]) * t,

        a[1] +
        (b[1] - a[1]) * t

      ]);
    }
  }


  if (geometria.length) {

    resultado.push(
      geometria[
        geometria.length - 1
      ]
    );
  }


  return resultado;
}


/* ======================================
   ASOCIAR MANIOBRAS A LA RUTA
====================================== */

function construirIndiceManiobras() {

  maniobras = [];

  let indiceBusqueda = 0;


  for (
    let p = 0;
    p < pasosRuta.length;
    p++
  ) {

    const paso =
      pasosRuta[p];


    const lon =
      paso.maneuver.location[0];

    const lat =
      paso.maneuver.location[1];


    let mejorIndice =
      indiceBusqueda;

    let mejorDistancia =
      Infinity;


    for (
      let i = indiceBusqueda;
      i < puntosRuta.length;
      i++
    ) {

      const punto =
        puntosRuta[i];


      const d =
        distanciaMetros(
          lat,
          lon,
          punto[1],
          punto[0]
        );


      if (
        Number.isFinite(d) &&
        d < mejorDistancia
      ) {

        mejorDistancia = d;
        mejorIndice = i;
      }


      if (mejorDistancia < 2)
        break;
    }


    maniobras.push({

      paso: paso,

      indicePunto:
        mejorIndice,

      error:
        mejorDistancia
    });


    indiceBusqueda =
      mejorIndice;
  }
}


/* ======================================
   LOCALIZAR GPS EN LA RUTA
====================================== */

function localizarEnRuta() {

  if (
    !puntosRuta.length ||
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    return null;
  }


  let inicio =
    Math.max(
      0,
      indiceRutaActual - 40
    );


  let fin =
    Math.min(
      puntosRuta.length - 1,
      indiceRutaActual + 300
    );


  if (indiceRutaActual === 0) {

    inicio = 0;
    fin = puntosRuta.length - 1;
  }


  let mejorIndice =
    indiceRutaActual;

  let mejorDistancia =
    Infinity;


  for (
    let i = inicio;
    i <= fin;
    i++
  ) {

    const punto =
      puntosRuta[i];


    const d =
      distanciaMetros(
        latActual,
        lonActual,
        punto[1],
        punto[0]
      );


    if (
      Number.isFinite(d) &&
      d < mejorDistancia
    ) {

      mejorDistancia = d;
      mejorIndice = i;
    }
  }


  if (
    mejorIndice >=
    indiceRutaActual - 8
  ) {

    indiceRutaActual =
      Math.max(
        0,
        mejorIndice
      );
  }


  return {
    indice:
      indiceRutaActual,

    distancia:
      mejorDistancia
  };
}


/* ======================================
   SIGUIENTE MANIOBRA
====================================== */

function actualizarIndiceManiobra() {

  while (
    indiceManiobra <
      maniobras.length - 1 &&

    indiceRutaActual >=
      maniobras[
        indiceManiobra
      ].indicePunto
  ) {

    indiceManiobra++;
  }
}


/* ======================================
   DISTANCIA POR LA RUTA
====================================== */

function distanciaHastaManiobra(
  desde,
  hasta
) {

  if (
    desde < 0 ||
    hasta < 0 ||
    desde >= puntosRuta.length ||
    hasta >= puntosRuta.length
  ) {

    return 0;
  }


  if (hasta <= desde)
    return 0;


  let total = 0;


  for (
    let i = desde;
    i < hasta;
    i++
  ) {

    const a =
      puntosRuta[i];

    const b =
      puntosRuta[i + 1];


    if (!a || !b)
      continue;


    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );


    if (Number.isFinite(d)) {

      total += d;
    }
  }


  return total;
}


/* ======================================
   MANIOBRA → ESP32
====================================== */

function comandoManiobra(paso) {

  const mod =
    paso.maneuver.modifier || "";

  const tipo =
    paso.maneuver.type || "";


  if (mod.includes("uturn"))
    return "T:UTURN";

  if (mod.includes("right"))
    return "T:RIGHT";

  if (mod.includes("left"))
    return "T:LEFT";

  if (
    mod.includes("straight") ||
    tipo === "continue" ||
    tipo === "depart"
  ) {

    return "T:STRAIGHT";
  }


  return "T:STRAIGHT";
}


/* ======================================
   NAVEGACIÓN GPS
====================================== */

async function actualizarNavegacionGPS() {

  if (
    !navegando ||
    !maniobras.length
  ) {

    return;
  }


  const localizacion =
    localizarEnRuta();


  if (!localizacion)
    return;


  actualizarIndiceManiobra();


  const actual =
    maniobras[
      indiceManiobra
    ];


  if (!actual)
    return;


  let distancia =
    distanciaHastaManiobra(

      indiceRutaActual,

      actual.indicePunto
    );


  if (!Number.isFinite(distancia)) {

    distancia = 0;
  }


  const metros =
    Math.max(
      0,
      Math.round(distancia)
    );


  const comando =
    comandoManiobra(
      actual.paso
    );


  const calle =
    actual.paso.name ||
    "Sin nombre";


  if (
    indiceManiobra !==
    ultimaManiobraEnviada
  ) {

    await enviar(comando);

    await esperar(70);

    await enviar(
      "C:" + calle
    );

    ultimaManiobraEnviada =
      indiceManiobra;
  }


  if (
    ultimaDistanciaEnviada === null ||
    Math.abs(
      metros -
      ultimaDistanciaEnviada
    ) >= 5
  ) {

    await esperar(40);

    await enviar(
      "D:" +
      metros +
      " m"
    );

    ultimaDistanciaEnviada =
      metros;
  }


  if (
    ultimaVelocidadEnviada === null ||
    velocidadActual !==
      ultimaVelocidadEnviada
  ) {

    await esperar(40);

    await enviar(
      "V:" +
      velocidadActual
    );

    ultimaVelocidadEnviada =
      velocidadActual;
  }


  actualizarPantallaWeb(
    localizacion.distancia
  );
}


/* ======================================
   INFORMACIÓN WEB
====================================== */

function actualizarPantallaWeb(
  distanciaRuta = null
) {

  if (!maniobras.length)
    return;


  actualizarIndiceManiobra();


  const actual =
    maniobras[
      indiceManiobra
    ];


  if (!actual)
    return;


  const distancia =
    distanciaHastaManiobra(
      indiceRutaActual,
      actual.indicePunto
    );


  const metros =
    Number.isFinite(distancia)
      ? Math.round(distancia)
      : 0;


  let texto =

    "🧭 <b>MANIOBRA " +

    (indiceManiobra + 1) +

    " / " +

    maniobras.length +

    "</b>" +

    "<br><br>" +

    comandoManiobra(
      actual.paso
    ) +

    "<br>" +

    (
      actual.paso.name ||
      "Sin nombre"
    ) +

    "<br><br>📏 <b>" +

    metros +

    " m</b>" +

    "<br>🛣 Punto ruta: " +

    indiceRutaActual +

    " / " +

    puntosRuta.length;


  if (
    Number.isFinite(
      distanciaRuta
    )
  ) {

    texto +=

      "<br>📡 Distancia GPS a ruta: " +

      Math.round(
        distanciaRuta
      ) +

      " m";
  }


  document.getElementById(
    "navdata"
  ).innerHTML = texto;
}


/* ======================================
   INICIAR NAVEGACIÓN
====================================== */

async function iniciarNavegacion() {

  if (!puntosRuta.length) {

    alert(
      "Primero calcula una ruta."
    );

    return;
  }


  navegando = true;

  ultimaManiobraEnviada = -1;
  ultimaDistanciaEnviada = null;
  ultimaVelocidadEnviada = null;


  await actualizarNavegacionGPS();
}


/* ======================================
   DETENER NAVEGACIÓN
====================================== */

async function detenerNavegacion() {

  navegando = false;

  await enviar("V:0");


  document.getElementById(
    "navdata"
  ).innerHTML =

    "⏹ Navegación detenida";
}


/* ======================================
   HAVERSINE
====================================== */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  if (
    !Number.isFinite(lat1) ||
    !Number.isFinite(lon1) ||
    !Number.isFinite(lat2) ||
    !Number.isFinite(lon2)
  ) {

    return Infinity;
  }


  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =

    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}
