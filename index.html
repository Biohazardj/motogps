<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGPS Simulador</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align:center;
  background:#111;
  color:white;
  padding:20px 12px;
}

button {
  display:block;
  width:92%;
  max-width:380px;
  margin:14px auto;
  padding:18px;
  font-size:18px;
  border:none;
  border-radius:12px;
  color:white;
}

#connect { background:#2196F3; }
#route { background:#9c27b0; }
#simulate { background:#00a86b; }
#stop { background:#d32f2f; }

#status, #simdata, #navdata {
  max-width:400px;
  margin:18px auto;
  line-height:1.6;
}

#navdata {
  text-align:left;
  background:#222;
  padding:18px;
  border-radius:12px;
  font-size:18px;
}

#simdata {
  color:#7CFC98;
}
</style>
</head>

<body>

<h1>🏍️ MotoGPS</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">Desconectado</div>

<hr>

<h2>Simulador de navegación</h2>

<button id="route" onclick="calcularRutaPrueba()">
1️⃣ CARGAR RUTA DE PRUEBA
</button>

<button id="simulate" onclick="iniciarSimulacion()">
2️⃣ ▶ SIMULAR RUTA
</button>

<button id="stop" onclick="detenerSimulacion()">
■ DETENER
</button>

<div id="simdata">
Esperando ruta
</div>

<div id="navdata">
Sin ruta
</div>

<script>

/* ==========================
   BLE
========================== */

const SERVICE_UUID =
'12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
'87654321-4321-4321-4321-ba0987654321';

let characteristic = null;


/* ==========================
   RUTA / SIMULACIÓN
========================== */

let pasosRuta = [];
let puntosRuta = [];

/*
 Cada elemento contendrá:

 {
   paso: paso OSRM,
   indicePunto: posición dentro
                de puntosRuta
 }
*/

let maniobras = [];

let indiceManiobra = 0;
let indiceSimulacion = 0;

let simulando = false;
let timer = null;

let ultimaManiobraEnviada = -1;


/* ==========================
   BLUETOOTH
========================== */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters:[{name:"MotoGPS"}],
        optionalServices:[SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}


/* ==========================
   ENVÍO BLE
========================== */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error.message;

    return false;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* ==========================
   RUTA DE PRUEBA
========================== */

async function calcularRutaPrueba() {

  detenerSimulacion();

  document.getElementById("simdata").innerHTML =
    "🌐 Descargando ruta OSRM...";


  const origen = {
    lat:42.5814,
    lon:-5.5640
  };

  const destino = {
    lat:42.5990,
    lon:-5.5670
  };


  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    origen.lon + "," +
    origen.lat + ";" +

    destino.lon + "," +
    destino.lat +

    "?overview=full" +
    "&geometries=geojson" +
    "&steps=true";


  try {

    const respuesta =
      await fetch(url);


    if (!respuesta.ok) {

      throw new Error(
        "HTTP " + respuesta.status
      );
    }


    const datos =
      await respuesta.json();


    if (
      datos.code !== "Ok" ||
      !datos.routes ||
      !datos.routes.length
    ) {

      throw new Error(
        "OSRM no devolvió una ruta"
      );
    }


    pasosRuta =
      datos.routes[0]
      .legs[0]
      .steps;


    const geometria =
      datos.routes[0]
      .geometry
      .coordinates;


    /*
      Creamos puntos cada ~5 m
      aproximadamente.
    */

    puntosRuta =
      densificarGeometria(
        geometria,
        5
      );


    /*
      Relacionamos cada maniobra
      OSRM con el punto más cercano
      de la geometría.
    */

    construirIndiceManiobras();


    indiceSimulacion = 0;

    ultimaManiobraEnviada = -1;


    /*
      Saltamos DEPART.
    */

    indiceManiobra = 0;

    if (
      maniobras.length > 1 &&
      maniobras[0].paso.maneuver.type ===
      "depart"
    ) {

      indiceManiobra = 1;
    }


    document.getElementById("simdata").innerHTML =

      "✅ RUTA PREPARADA" +

      "<br>Pasos OSRM: " +
      pasosRuta.length +

      "<br>Puntos de ruta: " +
      puntosRuta.length +

      "<br>Maniobras indexadas: " +
      maniobras.length;


    actualizarPantalla();

  } catch(error) {

    document.getElementById("simdata").innerHTML =

      "❌ ERROR<br>" +
      error.message;
  }
}


/* ==========================
   DENSIFICAR GEOMETRÍA
========================== */

function densificarGeometria(
  geometria,
  separacion
) {

  const resultado = [];


  for (
    let i = 0;
    i < geometria.length - 1;
    i++
  ) {

    const a = geometria[i];
    const b = geometria[i + 1];


    resultado.push(a);


    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );


    if (!Number.isFinite(d))
      continue;


    const partes =
      Math.max(
        1,
        Math.ceil(
          d / separacion
        )
      );


    for (
      let j = 1;
      j < partes;
      j++
    ) {

      const t =
        j / partes;


      resultado.push([

        a[0] +
        (b[0] - a[0]) * t,

        a[1] +
        (b[1] - a[1]) * t

      ]);
    }
  }


  if (geometria.length) {

    resultado.push(
      geometria[
        geometria.length - 1
      ]
    );
  }


  return resultado;
}


/* ==========================
   INDEXAR MANIOBRAS
========================== */

function construirIndiceManiobras() {

  maniobras = [];

  let indiceBusqueda = 0;


  for (
    let p = 0;
    p < pasosRuta.length;
    p++
  ) {

    const paso =
      pasosRuta[p];


    const lon =
      paso.maneuver.location[0];

    const lat =
      paso.maneuver.location[1];


    let mejorIndice =
      indiceBusqueda;

    let mejorDistancia =
      Infinity;


    /*
      Buscamos hacia delante.

      Así evitamos asociar una
      maniobra con una carretera
      anterior si la ruta se cruza.
    */

    for (
      let i = indiceBusqueda;
      i < puntosRuta.length;
      i++
    ) {

      const punto =
        puntosRuta[i];


      const d =
        distanciaMetros(
          lat,
          lon,
          punto[1],
          punto[0]
        );


      if (
        Number.isFinite(d) &&
        d < mejorDistancia
      ) {

        mejorDistancia = d;
        mejorIndice = i;
      }


      /*
        Cuando ya hemos encontrado
        un punto muy cercano no hace
        falta seguir buscando.
      */

      if (mejorDistancia < 2)
        break;
    }


    maniobras.push({

      paso:paso,

      indicePunto:
        mejorIndice,

      error:
        mejorDistancia
    });


    indiceBusqueda =
      mejorIndice;
  }
}


/* ==========================
   COMANDO DE MANIOBRA
========================== */

function comandoManiobra(paso) {

  const mod =
    paso.maneuver.modifier || "";

  const tipo =
    paso.maneuver.type || "";


  if (mod.includes("uturn"))
    return "T:UTURN";

  if (mod.includes("right"))
    return "T:RIGHT";

  if (mod.includes("left"))
    return "T:LEFT";

  if (
    mod.includes("straight") ||
    tipo === "continue" ||
    tipo === "depart"
  )
    return "T:STRAIGHT";


  return "T:STRAIGHT";
}


/* ==========================
   DISTANCIA POR LA CARRETERA
========================== */

function distanciaHastaManiobra(
  desde,
  hasta
) {

  if (
    desde < 0 ||
    hasta < 0 ||
    desde >= puntosRuta.length ||
    hasta >= puntosRuta.length
  ) {

    return 0;
  }


  if (hasta <= desde)
    return 0;


  let total = 0;


  for (
    let i = desde;
    i < hasta;
    i++
  ) {

    const a =
      puntosRuta[i];

    const b =
      puntosRuta[i + 1];


    if (!a || !b)
      continue;


    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );


    if (Number.isFinite(d)) {

      total += d;
    }
  }


  return total;
}


/* ==========================
   ACTUALIZAR MANIOBRA
========================== */

function actualizarIndiceManiobra() {

  /*
    Si hemos llegado o sobrepasado
    el punto de la maniobra,
    avanzamos a la siguiente.
  */

  while (
    indiceManiobra <
    maniobras.length - 1 &&
    indiceSimulacion >=
    maniobras[indiceManiobra].indicePunto
  ) {

    indiceManiobra++;
  }
}


/* ==========================
   ACTUALIZAR PANTALLA
========================== */

async function actualizarPantalla() {

  if (!maniobras.length)
    return;


  actualizarIndiceManiobra();


  const actual =
    maniobras[indiceManiobra];


  if (!actual)
    return;


  const paso =
    actual.paso;


  let distancia =
    distanciaHastaManiobra(

      indiceSimulacion,

      actual.indicePunto
    );


  /*
    Protección absoluta contra
    NaN / Infinity.
  */

  if (!Number.isFinite(distancia)) {

    distancia = 0;
  }


  const metros =
    Math.max(
      0,
      Math.round(distancia)
    );


  const comando =
    comandoManiobra(paso);


  const calle =
    paso.name ||
    "Sin nombre";


  document.getElementById("navdata").innerHTML =

    "🧭 <b>MANIOBRA " +

    (indiceManiobra + 1) +

    " / " +

    maniobras.length +

    "</b>" +

    "<br><br>" +

    comando +

    "<br>" +

    calle +

    "<br><br>" +

    "📏 <b>" +

    metros +

    " m</b>" +

    "<br><small>Punto ruta: " +

    indiceSimulacion +

    " → " +

    actual.indicePunto +

    "</small>";


  /*
    Flecha y calle solo se vuelven
    a enviar cuando cambia realmente
    la maniobra.
  */

  if (
    indiceManiobra !==
    ultimaManiobraEnviada
  ) {

    await enviar(comando);

    await esperar(80);

    await enviar(
      "C:" + calle
    );

    ultimaManiobraEnviada =
      indiceManiobra;
  }


  await esperar(50);


  /*
    Nunca enviamos NaN.
  */

  if (Number.isFinite(metros)) {

    await enviar(
      "D:" +
      metros +
      " m"
    );
  }
}


/* ==========================
   INICIAR SIMULACIÓN
========================== */

async function iniciarSimulacion() {

  if (!puntosRuta.length) {

    alert(
      "Primero carga la ruta"
    );

    return;
  }


  if (simulando)
    return;


  simulando = true;

  indiceSimulacion = 0;

  ultimaManiobraEnviada = -1;


  /*
    Empezamos en la primera
    maniobra útil.
  */

  indiceManiobra = 0;


  if (
    maniobras.length > 1 &&
    maniobras[0].paso.maneuver.type ===
    "depart"
  ) {

    indiceManiobra = 1;
  }


  await enviar("V:50");


  document.getElementById("simdata").innerHTML =
    "▶️ SIMULACIÓN EN MARCHA";


  await actualizarPantalla();


  timer =
    setInterval(
      avanzarSimulacion,
      350
    );
}


/* ==========================
   AVANZAR SIMULACIÓN
========================== */

async function avanzarSimulacion() {

  if (!simulando)
    return;


  indiceSimulacion++;


  if (
    indiceSimulacion >=
    puntosRuta.length
  ) {

    indiceSimulacion =
      puntosRuta.length - 1;


    await actualizarPantalla();


    detenerSimulacion();


    await enviar("V:0");


    document.getElementById("simdata").innerHTML =
      "🏁 SIMULACIÓN TERMINADA";

    return;
  }


  document.getElementById("simdata").innerHTML =

    "▶️ SIMULANDO" +

    "<br>Punto " +

    (indiceSimulacion + 1) +

    " / " +

    puntosRuta.length;


  await actualizarPantalla();
}


/* ==========================
   DETENER
========================== */

function detenerSimulacion() {

  simulando = false;


  if (timer) {

    clearInterval(timer);

    timer = null;
  }
}


/* ==========================
   HAVERSINE
========================== */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  if (
    !Number.isFinite(lat1) ||
    !Number.isFinite(lon1) ||
    !Number.isFinite(lat2) ||
    !Number.isFinite(lon2)
  ) {

    return Infinity;
  }


  const R =
    6371000;


  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;


  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =

    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}

</script>

</body>
</html>
