<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGPS</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #111;
  color: white;
  padding: 20px 12px;
}

button, input {
  display: block;
  width: 92%;
  max-width: 380px;
  margin: 12px auto;
  padding: 16px;
  font-size: 17px;
  border-radius: 12px;
  border: none;
  box-sizing: border-box;
}

input {
  background: white;
  color: black;
}

#connect { background:#2196F3; color:white; }
#gps { background:#ff9800; color:white; }
#route { background:#9c27b0; color:white; }

#simulate {
  background:#00a86b;
  color:white;
  font-weight:bold;
}

#stop {
  background:#d32f2f;
  color:white;
}

#status, #gpsdata, #navdata, #simdata {
  margin: 15px auto;
  line-height: 1.6;
  font-size: 16px;
  max-width: 400px;
}

#navdata {
  text-align:left;
  background:#222;
  padding:15px;
  border-radius:12px;
}

#simdata {
  color:#7CFC98;
}
</style>
</head>

<body>

<h1>🏍️ MotoGPS</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">Desconectado</div>

<button id="gps" onclick="iniciarGPS()">
ACTIVAR GPS REAL
</button>

<div id="gpsdata">
GPS desactivado
</div>

<hr>

<h2>Ruta</h2>

<input
  id="origen"
  type="text"
  placeholder="Origen simulación. Ej: Plaza Mayor, León">

<input
  id="destino"
  type="text"
  placeholder="Destino. Ej: Catedral de León">

<button id="route" onclick="calcularRuta()">
CALCULAR RUTA
</button>

<button id="simulate" onclick="iniciarSimulacion()">
▶ SIMULAR RUTA
</button>

<button id="stop" onclick="detenerSimulacion()">
■ DETENER SIMULACIÓN
</button>

<div id="simdata">
Modo simulación detenido
</div>

<div id="navdata">
Sin ruta activa
</div>

<script>

/* =============================
   BLE
============================= */

const SERVICE_UUID =
'12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
'87654321-4321-4321-4321-ba0987654321';

let characteristic = null;


/* =============================
   ESTADO
============================= */

let latActual = null;
let lonActual = null;

let pasosRuta = [];
let geometriaRuta = [];

let indicePaso = 0;

let ultimaVelocidadEnviada = null;
let ultimaDistanciaEnviada = null;

let simulando = false;
let indiceSimulacion = 0;
let temporizadorSimulacion = null;


/* =============================
   BLUETOOTH
============================= */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters:[{name:'MotoGPS'}],
        optionalServices:[SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error;
  }
}


/* =============================
   ENVÍO BLE
============================= */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error;

    return false;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* =============================
   GPS REAL
============================= */

function iniciarGPS() {

  if (!navigator.geolocation) {

    alert("GPS no disponible");
    return;
  }

  navigator.geolocation.watchPosition(

    async pos => {

      if (simulando)
        return;

      latActual =
        pos.coords.latitude;

      lonActual =
        pos.coords.longitude;


      let velocidad = 0;

      if (
        pos.coords.speed !== null &&
        pos.coords.speed >= 0
      ) {

        velocidad =
          Math.round(
            pos.coords.speed * 3.6
          );
      }


      document.getElementById("gpsdata").innerHTML =

        "📍 " +
        latActual.toFixed(6) +
        ", " +
        lonActual.toFixed(6) +

        "<br>🎯 Precisión: " +
        Math.round(pos.coords.accuracy) +
        " m" +

        "<br>🏍️ Velocidad: " +
        velocidad +
        " km/h";


      if (
        velocidad !==
        ultimaVelocidadEnviada
      ) {

        await enviar(
          "V:" + velocidad
        );

        ultimaVelocidadEnviada =
          velocidad;
      }

    },

    error => {

      document.getElementById("gpsdata").innerText =
        "❌ GPS: " + error.message;
    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:15000
    }
  );
}


/* =============================
   GEOCODIFICAR
============================= */

async function buscarLugar(texto) {

  const url =

    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&countrycodes=es" +
    "&q=" +
    encodeURIComponent(texto);


  const respuesta =
    await fetch(url);

  const datos =
    await respuesta.json();


  if (!datos.length)
    throw new Error(
      "No se encontró: " + texto
    );


  return {

    lat:parseFloat(datos[0].lat),
    lon:parseFloat(datos[0].lon),
    nombre:datos[0].display_name
  };
}


/* =============================
   CALCULAR RUTA
============================= */

async function calcularRuta() {

  try {

    detenerSimulacion();


    const origenTexto =
      document.getElementById("origen")
      .value.trim();

    const destinoTexto =
      document.getElementById("destino")
      .value.trim();


    if (!destinoTexto) {

      alert("Escribe un destino");
      return;
    }


    let origen;


    /*
      Para simulación usamos
      el origen escrito.

      Si está vacío utilizamos
      el GPS real.
    */

    if (origenTexto) {

      document.getElementById("navdata").innerHTML =
        "🔎 Buscando origen...";

      origen =
        await buscarLugar(origenTexto);

    } else {

      if (
        latActual === null ||
        lonActual === null
      ) {

        alert(
          "Escribe un origen o activa el GPS"
        );

        return;
      }

      origen = {
        lat:latActual,
        lon:lonActual
      };
    }


    document.getElementById("navdata").innerHTML =
      "🔎 Buscando destino...";


    const destino =
      await buscarLugar(destinoTexto);


    document.getElementById("navdata").innerHTML =
      "🗺️ Calculando ruta...";


    /*
      IMPORTANTE:
      ahora pedimos la geometría
      COMPLETA de la ruta.
    */

    const url =

      "https://router.project-osrm.org/route/v1/driving/" +

      origen.lon + "," +
      origen.lat + ";" +

      destino.lon + "," +
      destino.lat +

      "?overview=full" +
      "&geometries=geojson" +
      "&steps=true";


    const respuesta =
      await fetch(url);

    const datos =
      await respuesta.json();


    if (
      datos.code !== "Ok" ||
      !datos.routes ||
      !datos.routes.length
    ) {

      throw new Error(
        "No se pudo calcular la ruta"
      );
    }


    pasosRuta =
      datos.routes[0].legs[0].steps;


    geometriaRuta =
      datos.routes[0]
      .geometry
      .coordinates;


    indicePaso = 0;

    indiceSimulacion = 0;

    ultimaDistanciaEnviada = null;


    /*
      Ponemos la posición inicial
      en el comienzo de la ruta.
    */

    lonActual =
      geometriaRuta[0][0];

    latActual =
      geometriaRuta[0][1];


    /*
      Saltamos el paso DEPART
      si estamos ya encima.
    */

    if (
      pasosRuta.length > 1 &&
      pasosRuta[0].maneuver.type ===
      "depart"
    ) {

      indicePaso = 1;
    }


    await actualizarNavegacion();


    document.getElementById("simdata").innerHTML =

      "✅ Ruta cargada<br>" +

      geometriaRuta.length +
      " puntos de geometría";

  } catch(error) {

    document.getElementById("navdata").innerHTML =
      "❌ " + error.message;
  }
}


/* =============================
   MANIOBRA
============================= */

function convertirManiobra(paso) {

  const tipo =
    paso.maneuver.type || "";

  const mod =
    paso.maneuver.modifier || "";


  if (mod.includes("uturn"))
    return "T:UTURN";

  if (mod.includes("right"))
    return "T:RIGHT";

  if (mod.includes("left"))
    return "T:LEFT";

  if (
    mod.includes("straight") ||
    tipo === "continue" ||
    tipo === "depart"
  )
    return "T:STRAIGHT";


  return "T:STRAIGHT";
}


/* =============================
   NAVEGACIÓN
============================= */

async function actualizarNavegacion() {

  if (
    !pasosRuta.length ||
    indicePaso >= pasosRuta.length
  )
    return;


  /*
    Podemos avanzar varias maniobras
    si la posición simulada ya ha
    sobrepasado alguna.
  */

  while (
    indicePaso <
    pasosRuta.length
  ) {

    const paso =
      pasosRuta[indicePaso];


    const lonM =
      paso.maneuver.location[0];

    const latM =
      paso.maneuver.location[1];


    const distancia =
      distanciaMetros(
        latActual,
        lonActual,
        latM,
        lonM
      );


    /*
      En simulación la geometría
      pasa prácticamente por el
      punto de maniobra.
    */

    if (
      distancia <= 20 &&
      indicePaso <
      pasosRuta.length - 1
    ) {

      indicePaso++;
      continue;
    }

    break;
  }


  if (
    indicePaso >= pasosRuta.length
  )
    return;


  const paso =
    pasosRuta[indicePaso];


  const lonM =
    paso.maneuver.location[0];

  const latM =
    paso.maneuver.location[1];


  const distancia =
    Math.round(
      distanciaMetros(
        latActual,
        lonActual,
        latM,
        lonM
      )
    );


  const comando =
    convertirManiobra(paso);


  const calle =
    paso.name || "Sin nombre";


  document.getElementById("navdata").innerHTML =

    "🧭 <b>MANIOBRA " +
    (indicePaso + 1) +
    " / " +
    pasosRuta.length +
    "</b><br><br>" +

    comando +

    "<br>" +

    calle +

    "<br><br>" +

    "📏 <b>" +
    distancia +
    " m</b>";


  /*
    En esta fase de pruebas enviamos
    todo para ver claramente el cambio.
  */

  await enviar(comando);

  await esperar(80);

  await enviar(
    "C:" + calle
  );

  await esperar(80);


  if (
    ultimaDistanciaEnviada === null ||
    Math.abs(
      distancia -
      ultimaDistanciaEnviada
    ) >= 3
  ) {

    await enviar(
      "D:" +
      distancia +
      " m"
    );

    ultimaDistanciaEnviada =
      distancia;
  }
}


/* =============================
   SIMULACIÓN
============================= */

async function iniciarSimulacion() {

  if (!geometriaRuta.length) {

    alert(
      "Primero calcula una ruta"
    );

    return;
  }


  if (simulando)
    return;


  simulando = true;

  indiceSimulacion = 0;


  /*
    Velocidad ficticia mostrada
    en el ESP32.
  */

  await enviar("V:50");


  document.getElementById("simdata").innerHTML =
    "▶️ SIMULANDO...";


  temporizadorSimulacion =
    setInterval(
      pasoSimulacion,
      700
    );
}


async function pasoSimulacion() {

  if (!simulando)
    return;


  if (
    indiceSimulacion >=
    geometriaRuta.length
  ) {

    detenerSimulacion();

    document.getElementById("simdata").innerHTML =
      "🏁 Simulación terminada";

    await enviar("V:0");

    return;
  }


  const punto =
    geometriaRuta[
      indiceSimulacion
    ];


  lonActual =
    punto[0];

  latActual =
    punto[1];


  document.getElementById("simdata").innerHTML =

    "▶️ SIMULANDO<br>" +

    "Punto " +
    (indiceSimulacion + 1) +
    " / " +
    geometriaRuta.length;


  document.getElementById("gpsdata").innerHTML =

    "🧪 GPS SIMULADO" +

    "<br>📍 " +
    latActual.toFixed(6) +
    ", " +
    lonActual.toFixed(6) +

    "<br>🏍️ 50 km/h";


  await actualizarNavegacion();


  indiceSimulacion++;
}


/* =============================
   DETENER
============================= */

function detenerSimulacion() {

  simulando = false;


  if (temporizadorSimulacion) {

    clearInterval(
      temporizadorSimulacion
    );

    temporizadorSimulacion =
      null;
  }


  document.getElementById("simdata").innerHTML =
    "Modo simulación detenido";
}


/* =============================
   DISTANCIA
============================= */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}

</script>

</body>
</html>
