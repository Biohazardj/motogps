<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotoGPS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    button {
      display: block;
      width: 90%;
      max-width: 350px;
      margin: 15px auto;
      padding: 17px;
      font-size: 19px;
      border-radius: 12px;
      border: none;
    }

    #connect { background: #2196F3; color: white; }
    #gps { background: #ff9800; color: white; }
    .send { background: #4CAF50; color: white; }

    #status, #gpsdata {
      margin: 20px auto;
      line-height: 1.7;
      font-size: 17px;
    }
  </style>
</head>

<body>

<h1>MotoGPS</h1>

<button id="connect" onclick="conectar()">
  CONECTAR MOTOGPS
</button>

<div id="status">Desconectado</div>

<button id="gps" onclick="iniciarGPS()">
  ACTIVAR GPS
</button>

<div id="gpsdata">
  GPS desactivado
</div>

<button class="send" onclick="enviar('T:RIGHT')">
  ENVIAR T:RIGHT
</button>

<button class="send" onclick="enviar('T:LEFT')">
  ENVIAR T:LEFT
</button>


<script>

const SERVICE_UUID =
  '12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
  '87654321-4321-4321-4321-ba0987654321';

let characteristic;


/* ---------- BLUETOOTH ---------- */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [{ name: 'MotoGPS' }],
        optionalServices: [SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE_UUID);

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  }

  catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error;

  }
}


async function enviar(texto) {

  if (!characteristic) {
    document.getElementById("status").innerText =
      "Primero conecta MotoGPS";
    return;
  }

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    document.getElementById("status").innerText =
      "Enviado: " + texto;

  }

  catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error;

  }
}


/* ---------- GPS ---------- */

function iniciarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
      "Este navegador no permite GPS";

    return;
  }

  document.getElementById("gpsdata").innerText =
    "Buscando posición...";

  navigator.geolocation.watchPosition(

    actualizarGPS,

    errorGPS,

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}


function actualizarGPS(pos) {

  const lat =
    pos.coords.latitude.toFixed(6);

  const lon =
    pos.coords.longitude.toFixed(6);

  const precision =
    Math.round(pos.coords.accuracy);

  let velocidad = 0;

  if (pos.coords.speed !== null) {
    velocidad =
      Math.round(pos.coords.speed * 3.6);
  }

  document.getElementById("gpsdata").innerHTML =
    "📍 Latitud: " + lat +
    "<br>📍 Longitud: " + lon +
    "<br>🎯 Precisión: " + precision + " m" +
    "<br>🏍️ Velocidad: " + velocidad + " km/h";
}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
    "❌ Error GPS: " + error.message;
}

</script>

</body>
</html>
