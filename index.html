<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoGPS v16</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #111;
  color: white;
  padding: 20px 12px;
}

input {
  width: 88%;
  max-width: 360px;
  padding: 15px;
  margin: 8px auto;
  font-size: 17px;
  border-radius: 10px;
  border: none;
  display: block;
}

button {
  display: block;
  width: 92%;
  max-width: 390px;
  margin: 12px auto;
  padding: 17px;
  font-size: 17px;
  border: none;
  border-radius: 12px;
  color: white;
}

#connect { background: #2196F3; }
#gps { background: #ff9800; }
#route { background: #9c27b0; }
#navigate { background: #00a86b; }
#stop { background: #d32f2f; }

#status,
#gpsdata,
#routedata,
#navdata {
  max-width: 400px;
  margin: 15px auto;
  line-height: 1.55;
}

#gpsdata {
  color: #7CFC98;
}

#navdata {
  text-align: left;
  background: #222;
  padding: 17px;
  border-radius: 12px;
  font-size: 17px;
}
</style>
</head>

<body>

<h1>🏍️ MotoGPS v16</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">
ESP32 desconectado
</div>

<hr>

<button id="gps" onclick="activarGPS()">
1️⃣ ACTIVAR GPS
</button>

<div id="gpsdata">
GPS desactivado
</div>

<hr>

<h2>Destino</h2>

<input
  id="destino"
  type="text"
  placeholder="Ej: Catedral de León"
>

<button id="route" onclick="calcularRuta()">
2️⃣ CALCULAR RUTA
</button>

<div id="routedata">
Sin ruta
</div>

<button id="navigate" onclick="iniciarNavegacion()">
3️⃣ ▶ INICIAR NAVEGACIÓN
</button>

<button id="stop" onclick="detenerNavegacion()">
■ DETENER
</button>

<div id="navdata">
Esperando navegación
</div>


<script>

/* ======================================
   BLE
====================================== */

const SERVICE_UUID =
"12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-ba0987654321";

let characteristic = null;


/* ======================================
   GPS
====================================== */

let watchId = null;

let latActual = null;
let lonActual = null;
let velocidadActual = 0;
let precisionActual = null;

/*
   V16:
   posición anterior para calcular
   velocidad aunque coords.speed
   no funcione.
*/

let latAnterior = null;
let lonAnterior = null;
let tiempoAnterior = null;

let velocidadCalculada = 0;
let fuenteVelocidad = "SIN DATOS";

let contadorGPS = 0;
let ultimaActualizacionGPS = null;


/* ======================================
   RUTA
====================================== */

let pasosRuta = [];
let puntosRuta = [];
let maniobras = [];

let indiceRutaActual = 0;
let indiceManiobra = 0;

let navegando = false;

let ultimaManiobraEnviada = -1;
let ultimaDistanciaEnviada = null;
let ultimaVelocidadEnviada = null;


/* ======================================
   DESTINO
====================================== */

let destinoActual = null;


/* ======================================
   RECÁLCULO
====================================== */

let contadorFueraRuta = 0;
let recalculando = false;
let ultimoRecalculo = 0;

const DISTANCIA_FUERA_RUTA = 40;
const LECTURAS_FUERA_RUTA = 3;
const TIEMPO_ENTRE_RECALCULOS = 10000;


/* ======================================
   BLUETOOTH
====================================== */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [{ name: "MotoGPS" }],
        optionalServices: [SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}


/* ======================================
   ENVÍO BLE
====================================== */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error.message;

    return false;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* ======================================
   ACTIVAR GPS
====================================== */

function activarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
      "❌ GPS no disponible";

    return;
  }

  document.getElementById("gpsdata").innerText =
    "🛰️ Buscando posición...";

  if (watchId !== null) {

    navigator.geolocation.clearWatch(watchId);
  }

  /*
     Reiniciamos datos del cálculo
     de velocidad.
  */

  latAnterior = null;
  lonAnterior = null;
  tiempoAnterior = null;

  velocidadCalculada = 0;
  velocidadActual = 0;

  contadorGPS = 0;
  ultimaActualizacionGPS = null;

  watchId =
    navigator.geolocation.watchPosition(

      recibirPosicion,

      errorGPS,

      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}


/* ======================================
   NUEVA POSICIÓN GPS
====================================== */

async function recibirPosicion(pos) {

  const nuevaLat =
    pos.coords.latitude;

  const nuevaLon =
    pos.coords.longitude;

  const ahora =
    Date.now();

  precisionActual =
    pos.coords.accuracy;

  contadorGPS++;

  ultimaActualizacionGPS =
    ahora;


  /*
     ==================================
     V16 - VELOCIDAD CALCULADA
     ==================================

     Calculamos la velocidad mediante:

     distancia GPS / tiempo transcurrido
  */

  velocidadCalculada = 0;

  if (
    Number.isFinite(latAnterior) &&
    Number.isFinite(lonAnterior) &&
    Number.isFinite(tiempoAnterior)
  ) {

    const distanciaRecorrida =
      distanciaMetros(
        latAnterior,
        lonAnterior,
        nuevaLat,
        nuevaLon
      );

    const segundos =
      (ahora - tiempoAnterior) / 1000;

    if (
      Number.isFinite(distanciaRecorrida) &&
      segundos > 0
    ) {

      velocidadCalculada =
        (distanciaRecorrida / segundos) *
        3.6;
    }
  }


  /*
     Primero actualizamos posición.
  */

  latActual = nuevaLat;
  lonActual = nuevaLon;


  /*
     ==================================
     ELEGIR VELOCIDAD
     ==================================

     Si iOS entrega coords.speed
     válido y mayor que cero,
     lo utilizamos.

     Si no, utilizamos nuestra
     velocidad calculada.
  */

  if (
    pos.coords.speed !== null &&
    Number.isFinite(pos.coords.speed) &&
    pos.coords.speed > 0
  ) {

    velocidadActual =
      Math.max(
        0,
        Math.round(
          pos.coords.speed * 3.6
        )
      );

    fuenteVelocidad =
      "iPhone";

  } else {

    /*
       Evitamos mostrar velocidades
       absurdas producidas por un salto
       grande de GPS.

       200 km/h es simplemente un
       filtro de seguridad.
    */

    if (
      Number.isFinite(velocidadCalculada) &&
      velocidadCalculada >= 0 &&
      velocidadCalculada <= 200
    ) {

      velocidadActual =
        Math.round(
          velocidadCalculada
        );

    } else {

      velocidadActual = 0;
    }

    fuenteVelocidad =
      "Calculada";
  }


  /*
     Guardamos esta posición para
     la siguiente actualización.
  */

  latAnterior =
    nuevaLat;

  lonAnterior =
    nuevaLon;

  tiempoAnterior =
    ahora;


  /*
     INFORMACIÓN GPS
  */

  document.getElementById("gpsdata").innerHTML =

    "📍 GPS ACTIVO" +

    "<br>Lat: " +
    latActual.toFixed(6) +

    "<br>Lon: " +
    lonActual.toFixed(6) +

    "<br>Precisión: " +
    Math.round(precisionActual) +
    " m" +

    "<br>Velocidad: " +
    velocidadActual +
    " km/h" +

    "<br>Fuente velocidad: " +
    fuenteVelocidad +

    "<br>Actualizaciones GPS: " +
    contadorGPS +

    "<br>Última actualización: AHORA";


  /*
     Seguimiento de navegación:
     misma estructura que V13/V15.
  */

  if (
    navegando &&
    !recalculando
  ) {

    await actualizarNavegacionGPS();
  }
}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
    "❌ GPS: " + error.message;
}


/* ======================================
   GEOCODIFICAR DESTINO
====================================== */

async function buscarDestino(texto) {

  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&limit=1" +

    "&countrycodes=es" +

    "&q=" +

    encodeURIComponent(texto);

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      "Error buscando destino"
    );
  }

  const datos =
    await respuesta.json();

  if (!datos.length) {

    throw new Error(
      "Destino no encontrado"
    );
  }

  return {

    lat: Number(datos[0].lat),

    lon: Number(datos[0].lon),

    nombre:
      datos[0].display_name
  };
}


/* ======================================
   CALCULAR RUTA
====================================== */

async function calcularRuta() {

  if (
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    alert(
      "Primero activa el GPS y espera a tener posición."
    );

    return;
  }

  const texto =
    document
      .getElementById("destino")
      .value
      .trim();

  if (!texto) {

    alert(
      "Escribe un destino."
    );

    return;
  }

  document.getElementById("routedata").innerText =
    "🔎 Buscando destino...";

  try {

    destinoActual =
      await buscarDestino(texto);

    document.getElementById("routedata").innerText =
      "🌐 Calculando ruta...";

    await generarRuta(false);

  } catch (error) {

    document.getElementById("routedata").innerHTML =

      "❌ ERROR<br>" +
      error.message;
  }
}


/* ======================================
   GENERAR RUTA
====================================== */

async function generarRuta(esRecalculo) {

  if (!destinoActual) {

    throw new Error(
      "No hay destino guardado"
    );
  }

  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    lonActual + "," +
    latActual + ";" +

    destinoActual.lon + "," +
    destinoActual.lat +

    "?overview=full" +
    "&geometries=geojson" +
    "&steps=true";

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      "Error OSRM " +
      respuesta.status
    );
  }

  const datos =
    await respuesta.json();

  if (
    datos.code !== "Ok" ||
    !datos.routes ||
    !datos.routes.length
  ) {

    throw new Error(
      "No se pudo calcular la ruta"
    );
  }

  pasosRuta =
    datos.routes[0]
      .legs[0]
      .steps;

  const geometria =
    datos.routes[0]
      .geometry
      .coordinates;

  puntosRuta =
    densificarGeometria(
      geometria,
      5
    );

  construirIndiceManiobras();

  /*
     Seguimiento V13.
  */

  indiceRutaActual = 0;

  indiceManiobra = 0;

  if (
    maniobras.length > 1 &&
    maniobras[0]
      .paso
      .maneuver
      .type === "depart"
  ) {

    indiceManiobra = 1;
  }

  ultimaManiobraEnviada = -1;
  ultimaDistanciaEnviada = null;
  ultimaVelocidadEnviada = null;

  contadorFueraRuta = 0;

  const distanciaKm =
    datos.routes[0].distance / 1000;

  const minutos =
    datos.routes[0].duration / 60;

  document.getElementById("routedata").innerHTML =

    (
      esRecalculo
        ? "🔄 ✅ RUTA RECALCULADA"
        : "✅ RUTA CARGADA"
    ) +

    "<br>" +

    destinoActual.nombre +

    "<br><br>Distancia: " +

    distanciaKm.toFixed(1) +
    " km" +

    "<br>Tiempo OSRM: " +

    Math.round(minutos) +
    " min" +

    "<br>Maniobras: " +

    maniobras.length +

    "<br>Puntos: " +

    puntosRuta.length;

  /*
     Igual que V13.
  */
