<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGPS</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #111;
  color: white;
  padding: 25px 15px;
}

button, input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 15px auto;
  padding: 17px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  box-sizing: border-box;
}

input {
  background: white;
  color: black;
}

#connect { background: #2196F3; color: white; }
#gps { background: #ff9800; color: white; }
#route { background: #9c27b0; color: white; }

#status, #gpsdata, #navdata {
  margin: 20px auto;
  line-height: 1.6;
  font-size: 17px;
  max-width: 400px;
}

#navdata {
  text-align: left;
  background: #222;
  padding: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>MotoGPS</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">Desconectado</div>

<button id="gps" onclick="iniciarGPS()">
ACTIVAR GPS
</button>

<div id="gpsdata">GPS desactivado</div>

<hr>

<h2>Navegación</h2>

<input
  id="destino"
  type="text"
  placeholder="Ej: Catedral de León">

<button id="route" onclick="calcularRuta()">
INICIAR NAVEGACIÓN
</button>

<div id="navdata">
Sin ruta activa
</div>

<script>

const SERVICE_UUID =
'12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
'87654321-4321-4321-4321-ba0987654321';

let characteristic = null;

let latActual = null;
let lonActual = null;

let ultimaVelocidadEnviada = null;
let ultimaDistanciaEnviada = null;

let pasosRuta = [];
let indicePaso = 0;
let navegando = false;

/*
  NUEVO:
  guardamos la menor distancia
  alcanzada a la maniobra actual.
*/
let distanciaMinimaPaso = Infinity;


/* =========================
   BLUETOOTH
========================= */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [{ name: 'MotoGPS' }],
        optionalServices: [SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(SERVICE_UUID);

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error;
  }
}


/* =========================
   ENVÍO BLE
========================= */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error;

    return false;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* =========================
   GPS
========================= */

function iniciarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
      "GPS no disponible";

    return;
  }

  document.getElementById("gpsdata").innerText =
    "Buscando posición...";

  navigator.geolocation.watchPosition(
    actualizarGPS,
    errorGPS,
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
}


async function actualizarGPS(pos) {

  latActual = pos.coords.latitude;
  lonActual = pos.coords.longitude;

  const precision =
    Math.round(pos.coords.accuracy);

  let velocidad = 0;

  if (
    pos.coords.speed !== null &&
    pos.coords.speed >= 0
  ) {

    velocidad =
      Math.round(pos.coords.speed * 3.6);
  }


  document.getElementById("gpsdata").innerHTML =

    "📍 " +
    latActual.toFixed(6) +
    ", " +
    lonActual.toFixed(6) +

    "<br>🎯 Precisión: " +
    precision +
    " m" +

    "<br>🏍️ Velocidad: " +
    velocidad +
    " km/h";


  if (
    characteristic &&
    velocidad !== ultimaVelocidadEnviada
  ) {

    if (await enviar("V:" + velocidad)) {

      ultimaVelocidadEnviada =
        velocidad;
    }
  }


  if (navegando) {

    await actualizarNavegacion();
  }
}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
    "❌ GPS: " + error.message;
}


/* =========================
   BUSCAR DESTINO
========================= */

async function buscarDestino(texto) {

  const url =

    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&countrycodes=es" +
    "&q=" +
    encodeURIComponent(texto);

  const respuesta =
    await fetch(url);

  const datos =
    await respuesta.json();

  if (!datos.length) {

    throw new Error(
      "Destino no encontrado"
    );
  }

  return {

    lat: parseFloat(datos[0].lat),
    lon: parseFloat(datos[0].lon),
    nombre: datos[0].display_name
  };
}


/* =========================
   CALCULAR RUTA
========================= */

async function calcularRuta() {

  const salida =
    document.getElementById("navdata");

  try {

    if (
      latActual === null ||
      lonActual === null
    ) {

      salida.innerHTML =
        "❌ Primero activa el GPS";

      return;
    }


    const texto =
      document
      .getElementById("destino")
      .value
      .trim();

    if (!texto) {

      salida.innerHTML =
        "❌ Escribe un destino";

      return;
    }


    salida.innerHTML =
      "🔎 Buscando destino...";


    const destino =
      await buscarDestino(texto);


    salida.innerHTML =
      "🗺️ Calculando ruta...";


    const url =

      "https://router.project-osrm.org/route/v1/driving/" +

      lonActual + "," +
      latActual + ";" +

      destino.lon + "," +
      destino.lat +

      "?overview=false&steps=true";


    const respuesta =
      await fetch(url);

    const datos =
      await respuesta.json();


    if (
      datos.code !== "Ok" ||
      !datos.routes ||
      !datos.routes.length
    ) {

      throw new Error(
        "No se pudo calcular la ruta"
      );
    }


    pasosRuta =
      datos.routes[0].legs[0].steps;

    indicePaso = 0;

    navegando = true;

    ultimaDistanciaEnviada = null;

    distanciaMinimaPaso = Infinity;


    await enviarPasoActual();

    await actualizarNavegacion();

  } catch(error) {

    salida.innerHTML =
      "❌ " + error.message;
  }
}


/* =========================
   MANIOBRA → COMANDO
========================= */

function convertirManiobra(paso) {

  const tipo =
    paso.maneuver.type || "";

  const modificador =
    paso.maneuver.modifier || "";


  if (modificador.includes("uturn"))
    return "T:UTURN";

  if (modificador.includes("right"))
    return "T:RIGHT";

  if (modificador.includes("left"))
    return "T:LEFT";

  if (
    modificador.includes("straight") ||
    tipo === "continue" ||
    tipo === "depart"
  )
    return "T:STRAIGHT";


  return "T:STRAIGHT";
}


/* =========================
   ENVIAR PASO ACTUAL
========================= */

async function enviarPasoActual() {

  if (
    !pasosRuta.length ||
    indicePaso >= pasosRuta.length
  )
    return;


  const paso =
    pasosRuta[indicePaso];


  await enviar(
    convertirManiobra(paso)
  );

  await esperar(120);


  await enviar(
    "C:" +
    (paso.name || "Sin nombre")
  );


  ultimaDistanciaEnviada = null;
}


/* =========================
   MOSTRAR PASO
========================= */

function mostrarPasoActual(distancia) {

  if (
    indicePaso >= pasosRuta.length
  )
    return;


  const paso =
    pasosRuta[indicePaso];


  document.getElementById("navdata").innerHTML =

    "🧭 <b>MANIOBRA " +
    (indicePaso + 1) +
    " / " +
    pasosRuta.length +
    "</b><br><br>" +

    convertirManiobra(paso) +

    "<br>" +

    (paso.name || "Sin nombre") +

    "<br><br>" +

    "📏 <b>" +
    Math.round(distancia) +
    " m</b>";
}


/* =========================
   CAMBIAR AL SIGUIENTE PASO
========================= */

async function siguientePaso() {

  indicePaso++;

  ultimaDistanciaEnviada = null;

  /*
    MUY IMPORTANTE:
    reiniciamos la distancia mínima
    para la nueva maniobra.
  */
  distanciaMinimaPaso = Infinity;


  if (
    indicePaso >= pasosRuta.length
  ) {

    navegando = false;

    document.getElementById("navdata").innerHTML =
      "🏁 <b>Destino alcanzado</b>";

    await enviar("D:0 m");

    return;
  }


  await esperar(120);

  await enviarPasoActual();


  /*
    Pintamos inmediatamente
    la siguiente maniobra.
  */

  const nuevoPaso =
    pasosRuta[indicePaso];

  const nuevaLon =
    nuevoPaso.maneuver.location[0];

  const nuevaLat =
    nuevoPaso.maneuver.location[1];


  const nuevaDistancia =
    distanciaMetros(
      latActual,
      lonActual,
      nuevaLat,
      nuevaLon
    );


  mostrarPasoActual(
    nuevaDistancia
  );


  const d =
    Math.round(nuevaDistancia);


  if (
    await enviar(
      "D:" + d + " m"
    )
  ) {

    ultimaDistanciaEnviada = d;
  }
}


/* =========================
   NAVEGACIÓN
========================= */

async function actualizarNavegacion() {

  if (
    !navegando ||
    indicePaso >= pasosRuta.length
  )
    return;


  const paso =
    pasosRuta[indicePaso];


  const lonManiobra =
    paso.maneuver.location[0];

  const latManiobra =
    paso.maneuver.location[1];


  const distancia =
    distanciaMetros(
      latActual,
      lonActual,
      latManiobra,
      lonManiobra
    );


  const distanciaRedondeada =
    Math.round(distancia);


  mostrarPasoActual(
    distanciaRedondeada
  );


  /*
    GUARDAMOS LA DISTANCIA MÁS
    CERCANA QUE HEMOS ALCANZADO.
  */

  if (
    distancia <
    distanciaMinimaPaso
  ) {

    distanciaMinimaPaso =
      distancia;
  }


  /* ENVIAR DISTANCIA */

  if (
    characteristic &&
    (
      ultimaDistanciaEnviada === null ||
      Math.abs(
        distanciaRedondeada -
        ultimaDistanciaEnviada
      ) >= 3
    )
  ) {

    if (
      await enviar(
        "D:" +
        distanciaRedondeada +
        " m"
      )
    ) {

      ultimaDistanciaEnviada =
        distanciaRedondeada;
    }
  }


  /*
    ============================
    DETECCIÓN DE MANIOBRA PASADA
    ============================

    CASO 1:
    estamos a 15 m o menos.

    CASO 2:
    hemos llegado al menos a
    35 m del giro y después nos
    hemos alejado 15 m respecto
    al punto más cercano.

    Esto evita quedarnos atascados
    si el GPS no entra exactamente
    en el radio pequeño.
  */

  const muyCerca =
    distancia <= 15;


  const hemosPasado =

    distanciaMinimaPaso <= 35 &&

    distancia >
    distanciaMinimaPaso + 15;


  if (
    muyCerca ||
    hemosPasado
  ) {

    await siguientePaso();
  }
}


/* =========================
   DISTANCIA HAVERSINE
========================= */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;
}

</script>

</body>
</html>
