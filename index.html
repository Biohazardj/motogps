<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {

}

<body>

<h1>🏍️ MotoGPS v16.1</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">
ESP32 desconectado
</div>

<hr>

<button id="gps" onclick="activarGPS()">
1️⃣ ACTIVAR GPS
</button>

<div id="gpsdata">
GPS desactivado
</div>

<hr>

<h2>Destino</h2>

<input
  id="destino"
  type="text"
  placeholder="Ej: Catedral de León"
>

<button id="route" onclick="calcularRuta()">
2️⃣ CALCULAR RUTA
</button>

<div id="routedata">
Sin ruta
</div>

<button id="navigate" onclick="iniciarNavegacion()">
3️⃣ ▶ INICIAR NAVEGACIÓN
</button>

<button id="stop" onclick="detenerNavegacion()">
■ DETENER
</button>

<div id="navdata">
Esperando navegación
</div>


<script>

/* ======================================
   BLE
====================================== */

const SERVICE_UUID =
"12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-ba0987654321";

let characteristic = null;


/* ======================================
   GPS
====================================== */

let watchId = null;

let latActual = null;
let lonActual = null;
let velocidadActual = 0;
let precisionActual = null;

/* V16.1 */

let latAnterior = null;
let lonAnterior = null;
let tiempoAnterior = null;

let contadorGPS = 0;
let fuenteVelocidad = "Sin datos";


/* ======================================
   RUTA
====================================== */

let pasosRuta = [];
let puntosRuta = [];
let maniobras = [];

let indiceRutaActual = 0;
let indiceManiobra = 0;

let navegando = false;

let ultimaManiobraEnviada = -1;
let ultimaDistanciaEnviada = null;
let ultimaVelocidadEnviada = null;


/* ======================================
   DESTINO
====================================== */

let destinoActual = null;


/* ======================================
   RECÁLCULO
====================================== */

let contadorFueraRuta = 0;
let recalculando = false;
let ultimoRecalculo = 0;

const DISTANCIA_FUERA_RUTA = 40;
const LECTURAS_FUERA_RUTA = 3;
const TIEMPO_ENTRE_RECALCULOS = 10000;


/* ======================================
   BLUETOOTH
====================================== */

async function conectar() {

  document.getElementById("status").innerText =
    "Buscando MotoGPS...";

  try {

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [{ name: "MotoGPS" }],
        optionalServices: [SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}


/* ======================================
   ENVÍO BLE
====================================== */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch (error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error.message;

    return false;
  }
}


function esperar(ms) {

  return new Promise(function(resolve) {
    setTimeout(resolve, ms);
  });
}


/* ======================================
   ACTIVAR GPS
====================================== */

function activarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
      "❌ GPS no disponible";

    return;
  }

  document.getElementById("gpsdata").innerText =
    "🛰️ Buscando posición...";

  if (watchId !== null) {

    navigator.geolocation.clearWatch(watchId);
  }

  latAnterior = null;
  lonAnterior = null;
  tiempoAnterior = null;

  contadorGPS = 0;
  velocidadActual = 0;
  fuenteVelocidad = "Sin datos";

  watchId =
    navigator.geolocation.watchPosition(
      recibirPosicion,
      errorGPS,
      {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 15000
      }
    );
}


/* ======================================
   NUEVA POSICIÓN GPS
====================================== */

async function recibirPosicion(pos) {

  const nuevaLat =
    pos.coords.latitude;

  const nuevaLon =
    pos.coords.longitude;

  const ahora =
    Date.now();

  precisionActual =
    pos.coords.accuracy;

  contadorGPS++;


  /*
     Primero intentamos usar
     la velocidad nativa del iPhone.
  */

  let velocidadNativa = null;

  if (
    pos.coords.speed !== null &&
    Number.isFinite(pos.coords.speed) &&
    pos.coords.speed > 0
  ) {

    velocidadNativa =
      pos.coords.speed * 3.6;
  }


  /*
     Si iPhone no da velocidad,
     la calculamos entre dos
     posiciones GPS consecutivas.
  */

  let velocidadPorPosicion = null;

  if (
    Number.isFinite(latAnterior) &&
    Number.isFinite(lonAnterior) &&
    tiempoAnterior !== null
  ) {

    const distancia =
      distanciaMetros(
        latAnterior,
        lonAnterior,
        nuevaLat,
        nuevaLon
      );

    const segundos =
      (ahora - tiempoAnterior) / 1000;

    if (
      Number.isFinite(distancia) &&
      segundos >= 0.5
    ) {

      velocidadPorPosicion =
        (distancia / segundos) * 3.6;
    }
  }


  /*
     Elegimos velocidad.
  */

  if (
    velocidadNativa !== null &&
    velocidadNativa <= 200
  ) {

    velocidadActual =
      Math.round(velocidadNativa);

    fuenteVelocidad =
      "iPhone";

  } else if (
    velocidadPorPosicion !== null &&
    velocidadPorPosicion >= 0 &&
    velocidadPorPosicion <= 200
  ) {

    velocidadActual =
      Math.round(velocidadPorPosicion);

    fuenteVelocidad =
      "Calculada";

  } else {

    velocidadActual = 0;

    fuenteVelocidad =
      "Sin velocidad";
  }


  /*
     Actualizamos posición actual.
  */

  latActual =
    nuevaLat;

  lonActual =
    nuevaLon;


  /*
     Guardamos posición y hora
     para la siguiente lectura.
  */

  latAnterior =
    nuevaLat;

  lonAnterior =
    nuevaLon;

  tiempoAnterior =
    ahora;


  document.getElementById("gpsdata").innerHTML =

    "📍 GPS ACTIVO" +

    "<br>Lat: " +
    latActual.toFixed(6) +

    "<br>Lon: " +
    lonActual.toFixed(6) +

    "<br>Precisión: " +
    Math.round(precisionActual) +
    " m" +

    "<br>Velocidad: " +
    velocidadActual +
    " km/h" +

    "<br>Fuente: " +
    fuenteVelocidad +

    "<br>Actualizaciones GPS: " +
    contadorGPS;


  /*
     Igual que V13:
     cada nueva posición actualiza
     la navegación.
  */

  if (
    navegando &&
    !recalculando
  ) {

    await actualizarNavegacionGPS();
  }
}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
    "❌ GPS: " + error.message;
}


/* ======================================
   GEOCODIFICAR DESTINO
====================================== */

async function buscarDestino(texto) {

  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&limit=1" +

    "&countrycodes=es" +

    "&q=" +

    encodeURIComponent(texto);

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      "Error buscando destino"
    );
  }

  const datos =
    await respuesta.json();

  if (!datos.length) {

    throw new Error(
      "Destino no encontrado"
    );
  }

  return {

    lat: Number(datos[0].lat),

    lon: Number(datos[0].lon),

    nombre:
      datos[0].display_name
  };
}


/* ======================================
   CALCULAR RUTA
====================================== */

async function calcularRuta() {

  if (
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    alert(
      "Primero activa el GPS y espera a tener posición."
    );

    return;
  }

  const texto =
    document
      .getElementById("destino")
      .value
      .trim();

  if (!texto) {

    alert(
      "Escribe un destino."
    );

    return;
  }

  document.getElementById("routedata").innerText =
    "🔎 Buscando destino...";

  try {

    destinoActual =
      await buscarDestino(texto);

    document.getElementById("routedata").innerText =
      "🌐 Calculando ruta...";

    await generarRuta(false);

  } catch (error) {

    document.getElementById("routedata").innerHTML =

      "❌ ERROR<br>" +
      error.message;
  }
}


/* ======================================
   GENERAR RUTA
====================================== */

async function generarRuta(esRecalculo) {

  if (!destinoActual) {

    throw new Error(
      "No hay destino guardado"
    );
  }

  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    lonActual + "," +
    latActual + ";" +

    destinoActual.lon + "," +
    destinoActual.lat +

    "?overview=full" +
    "&geometries=geojson" +
    "&steps=true";

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      "Error OSRM " +
      respuesta.status
    );
  }

  const datos =
    await respuesta.json();

  if (
    datos.code !== "Ok" ||
    !datos.routes ||
    !datos.routes.length
  ) {

    throw new Error(
      "No se pudo calcular la ruta"
    );
  }

  pasosRuta =
    datos.routes[0]
      .legs[0]
      .steps;

  const geometria =
    datos.routes[0]
      .geometry
      .coordinates;

  puntosRuta =
    densificarGeometria(
      geometria,
      5
    );

  construirIndiceManiobras();

  indiceRutaActual = 0;

  indiceManiobra = 0;

  if (
    maniobras.length > 1 &&
    maniobras[0]
      .paso
      .maneuver
      .type === "depart"
  ) {

    indiceManiobra = 1;
  }

  ultimaManiobraEnviada = -1;
  ultimaDistanciaEnviada = null;
  ultimaVelocidadEnviada = null;

  contadorFueraRuta = 0;

  const distanciaKm =
    datos.routes[0].distance / 1000;

  const minutos =
    datos.routes[0].duration / 60;

  document.getElementById("routedata").innerHTML =

    (
      esRecalculo
        ? "🔄 ✅ RUTA RECALCULADA"
        : "✅ RUTA CARGADA"
    ) +

    "<br>" +

    destinoActual.nombre +

    "<br><br>Distancia: " +

    distanciaKm.toFixed(1) +
    " km" +

    "<br>Tiempo OSRM: " +

    Math.round(minutos) +
    " min" +

    "<br>Maniobras: " +

    maniobras.length +

    "<br>Puntos: " +

    puntosRuta.length;

  localizarEnRuta();

  actualizarPantallaWeb();
}


/* ======================================
   DENSIFICAR GEOMETRÍA
====================================== */

function densificarGeometria(
  geometria,
  separacion
) {

  const resultado = [];

  for (
    let i = 0;
    i < geometria.length - 1;
    i++
  ) {

    const a = geometria[i];
    const b = geometria[i + 1];

    resultado.push(a);

    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );

    if (!Number.isFinite(d))
      continue;

    const partes =
      Math.max(
        1,
        Math.ceil(
          d / separacion
        )
      );

    for (
      let j = 1;
      j < partes;
      j++
    ) {

      const t =
        j / partes;

      resultado.push([

        a[0] +
        (b[0] - a[0]) * t,

        a[1] +
        (b[1] - a[1]) * t

      ]);
    }
  }

  if (geometria.length) {

    resultado.push(
      geometria[
        geometria.length - 1
      ]
    );
  }

  return resultado;
}


/* ======================================
   ASOCIAR MANIOBRAS A RUTA
====================================== */

function construirIndiceManiobras() {

  maniobras = [];

  let indiceBusqueda = 0;

  for (
    let p = 0;
    p < pasosRuta.length;
    p++
  ) {

    const paso =
      pasosRuta[p];

    const lon =
      paso.maneuver.location[0];

    const lat =
      paso.maneuver.location[1];

    let mejorIndice =
      indiceBusqueda;

    let mejorDistancia =
      Infinity;

    for (
      let i = indiceBusqueda;
      i < puntosRuta.length;
      i++
    ) {

      const punto =
        puntosRuta[i];

      const d =
        distanciaMetros(
          lat,
          lon,
          punto[1],
          punto[0]
        );

      if (
        Number.isFinite(d) &&
        d < mejorDistancia
      ) {

        mejorDistancia = d;
        mejorIndice = i;
      }

      if (mejorDistancia < 2)
        break;
    }

    maniobras.push({

      paso: paso,

      indicePunto:
        mejorIndice,

      error:
        mejorDistancia
    });

    indiceBusqueda =
      mejorIndice;
  }
}


/* ======================================
   LOCALIZAR GPS EN LA RUTA
   LÓGICA V13
====================================== */

function localizarEnRuta() {

  if (
    !puntosRuta.length ||
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    return null;
  }

  let inicio =
    Math.max(
      0,
      indiceRutaActual - 40
    );

  let fin =
    Math.min(
      puntosRuta.length - 1,
      indiceRutaActual + 300
    );

  if (indiceRutaActual === 0) {

    inicio = 0;
    fin = puntosRuta.length - 1;
  }

  let mejorIndice =
    indiceRutaActual;

  let mejorDistancia =
    Infinity;

  for (
    let i = inicio;
    i <= fin;
    i++
  ) {

    const punto =
      puntosRuta[i];

    const d =
      distanciaMetros(
        latActual,
        lonActual,
        punto[1],
        punto[0]
      );

    if (
      Number.isFinite(d) &&
      d < mejorDistancia
    ) {

      mejorDistancia = d;
      mejorIndice = i;
    }
  }

  if (
    mejorIndice >=
    indiceRutaActual - 8
  ) {

    indiceRutaActual =
      Math.max(
        0,
        mejorIndice
      );
  }

  return {
    indice:
      indiceRutaActual,

    distancia:
      mejorDistancia
  };
}


/* ======================================
   SIGUIENTE MANIOBRA
====================================== */

function actualizarIndiceManiobra() {

  while (
    indiceManiobra <
      maniobras.length - 1 &&

    indiceRutaActual >=
      maniobras[
        indiceManiobra
      ].indicePunto
  ) {

    indiceManiobra++;
  }
}


/* ======================================
   DISTANCIA POR RUTA
   LÓGICA V13
====================================== */

function distanciaHastaManiobra(
  desde,
  hasta
) {

  if (
    desde < 0 ||
    hasta < 0 ||
    desde >= puntosRuta.length ||
    hasta >= puntosRuta.length
  ) {

    return 0;
  }

  if (hasta <= desde)
    return 0;

  let total = 0;

  for (
    let i = desde;
    i < hasta;
    i++
  ) {

    const a =
      puntosRuta[i];

    const b =
      puntosRuta[i + 1];

    if (!a || !b)
      continue;

    const d =
      distancia
