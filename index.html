<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotoGPS Simulador</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align:center;
  background:#111;
  color:white;
  padding:20px 12px;
}

button {
  display:block;
  width:92%;
  max-width:380px;
  margin:14px auto;
  padding:18px;
  font-size:18px;
  border:none;
  border-radius:12px;
  color:white;
}

#connect { background:#2196F3; }
#route { background:#9c27b0; }
#simulate { background:#00a86b; }
#stop { background:#d32f2f; }

#status,
#simdata,
#navdata {
  max-width:400px;
  margin:18px auto;
  line-height:1.6;
}

#navdata {
  text-align:left;
  background:#222;
  padding:18px;
  border-radius:12px;
  font-size:18px;
}

#simdata {
  color:#7CFC98;
}
</style>
</head>

<body>

<h1>🏍️ MotoGPS</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">
Desconectado
</div>

<hr>

<h2>Simulador de navegación</h2>

<button id="route" onclick="calcularRutaPrueba()">
1️⃣ CARGAR RUTA DE PRUEBA
</button>

<button id="simulate" onclick="iniciarSimulacion()">
2️⃣ ▶ SIMULAR RUTA
</button>

<button id="stop" onclick="detenerSimulacion()">
■ DETENER
</button>

<div id="simdata">
Esperando ruta
</div>

<div id="navdata">
Sin ruta
</div>

<script>

const SERVICE_UUID =
'12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
'87654321-4321-4321-4321-ba0987654321';

let characteristic = null;

let pasosRuta = [];
let puntosSimulacion = [];

let indicePaso = 0;
let indiceSimulacion = 0;

let simulando = false;
let timer = null;

let latActual = null;
let lonActual = null;


/* =========================
   BLE
========================= */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters:[{name:"MotoGPS"}],
        optionalServices:[SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  }

  catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}


/* =========================
   BLE SEND
========================= */

async function enviar(texto) {

  if (!characteristic)
    return;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

  }

  catch(error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error.message;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve,ms)
  );
}


/* =========================
   RUTA DE PRUEBA
========================= */

async function calcularRutaPrueba() {

  detenerSimulacion();

  document.getElementById("simdata").innerHTML =
    "🌐 Conectando con OSRM...";


  /*
    Dos coordenadas fijas para
    nuestra prueba.

    No utilizamos Nominatim.
  */

  const origen = {
    lat:42.5814,
    lon:-5.5640
  };

  const destino = {
    lat:42.5990,
    lon:-5.5670
  };


  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    origen.lon + "," +
    origen.lat + ";" +

    destino.lon + "," +
    destino.lat +

    "?overview=full" +
    "&geometries=geojson" +
    "&steps=true";


  try {

    const respuesta =
      await fetch(url);


    if (!respuesta.ok) {

      throw new Error(
        "HTTP " + respuesta.status
      );
    }


    const datos =
      await respuesta.json();


    if (
      datos.code !== "Ok" ||
      !datos.routes ||
      !datos.routes.length
    ) {

      throw new Error(
        "OSRM no devolvió ruta"
      );
    }


    pasosRuta =
      datos.routes[0]
      .legs[0]
      .steps;


    /*
      Esta geometría representa
      literalmente la carretera.
    */

    const geometria =
      datos.routes[0]
      .geometry
      .coordinates;


    /*
      Generamos MUCHOS puntos
      intermedios.

      Así no dependemos de que
      OSRM tenga puntos separados
      muchos metros.
    */

    puntosSimulacion =
      densificarGeometria(
        geometria,
        5
      );


    indicePaso = 0;
    indiceSimulacion = 0;


    /*
      El primer paso suele ser
      DEPART. Para navegación nos
      interesa el siguiente giro.
    */

    if (
      pasosRuta.length > 1 &&
      pasosRuta[0].maneuver.type ===
      "depart"
    ) {

      indicePaso = 1;
    }


    lonActual =
      puntosSimulacion[0][0];

    latActual =
      puntosSimulacion[0][1];


    document.getElementById("simdata").innerHTML =

      "✅ RUTA CARGADA" +

      "<br>Maniobras: " +
      pasosRuta.length +

      "<br>Puntos simulados: " +
      puntosSimulacion.length;


    await actualizarNavegacion();

  }

  catch(error) {

    document.getElementById("simdata").innerHTML =

      "❌ ERROR RUTA<br>" +
      error.message;
  }
}


/* =========================
   DENSIFICAR GEOMETRÍA
========================= */

function densificarGeometria(
  geometria,
  separacion
) {

  const resultado = [];


  for (
    let i = 0;
    i < geometria.length - 1;
    i++
  ) {

    const a = geometria[i];
    const b = geometria[i + 1];


    resultado.push(a);


    const distancia =
      distanciaMetros(
        a[1],a[0],
        b[1],b[0]
      );


    const partes =
      Math.floor(
        distancia / separacion
      );


    for (
      let j = 1;
      j < partes;
      j++
    ) {

      const t =
        j / partes;


      const lon =
        a[0] +
        (b[0] - a[0]) * t;


      const lat =
        a[1] +
        (b[1] - a[1]) * t;


      resultado.push(
        [lon,lat]
      );
    }
  }


  resultado.push(
    geometria[
      geometria.length - 1
    ]
  );


  return resultado;
}


/* =========================
   MANIOBRA
========================= */

function comandoManiobra(paso) {

  const mod =
    paso.maneuver.modifier || "";

  const tipo =
    paso.maneuver.type || "";


  if (mod.includes("uturn"))
    return "T:UTURN";


  if (mod.includes("right"))
    return "T:RIGHT";


  if (mod.includes("left"))
    return "T:LEFT";


  if (
    mod.includes("straight") ||
    tipo === "continue" ||
    tipo === "depart"
  )
    return "T:STRAIGHT";


  return "T:STRAIGHT";
}


/* =========================
   ACTUALIZAR NAVEGACIÓN
========================= */

async function actualizarNavegacion() {

  if (
    !pasosRuta.length ||
    indicePaso >= pasosRuta.length
  )
    return;


  /*
    Comprobamos si estamos encima
    de la maniobra actual.
  */

  let paso =
    pasosRuta[indicePaso];


  let distancia =
    distanciaMetros(

      latActual,
      lonActual,

      paso.maneuver.location[1],
      paso.maneuver.location[0]
    );


  /*
    Como la simulación sigue
    exactamente la geometría de
    OSRM, 12 m es suficiente.
  */

  if (
    distancia <= 12 &&
    indicePaso <
    pasosRuta.length - 1
  ) {

    indicePaso++;

    paso =
      pasosRuta[indicePaso];


    distancia =
      distanciaMetros(

        latActual,
        lonActual,

        paso.maneuver.location[1],
        paso.maneuver.location[0]
      );
  }


  const comando =
    comandoManiobra(paso);


  const calle =
    paso.name || "Sin nombre";


  const metros =
    Math.round(distancia);


  document.getElementById("navdata").innerHTML =

    "🧭 <b>MANIOBRA " +

    (indicePaso + 1) +

    " / " +

    pasosRuta.length +

    "</b>" +

    "<br><br>" +

    comando +

    "<br>" +

    calle +

    "<br><br>" +

    "📏 <b>" +

    metros +

    " m</b>";


  /*
    Enviamos al ESP32.
  */

  await enviar(comando);

  await esperar(50);

  await enviar(
    "C:" + calle
  );

  await esperar(50);

  await enviar(
    "D:" +
    metros +
    " m"
  );
}


/* =========================
   SIMULACIÓN
========================= */

async function iniciarSimulacion() {

  if (!puntosSimulacion.length) {

    alert(
      "Primero carga la ruta"
    );

    return;
  }


  if (simulando)
    return;


  simulando = true;

  indiceSimulacion = 0;


  await enviar("V:50");


  document.getElementById("simdata").innerHTML =
    "▶️ SIMULACIÓN EN MARCHA";


  /*
    Cada 250 ms avanzamos
    aproximadamente 5 metros.

    Equivale a unos 72 km/h
    visualmente y permite probar
    rápido toda la ruta.
  */

  timer =
    setInterval(
      avanzarSimulacion,
      250
    );
}


/* =========================
   AVANZAR
========================= */

async function avanzarSimulacion() {

  if (!simulando)
    return;


  if (
    indiceSimulacion >=
    puntosSimulacion.length
  ) {

    detenerSimulacion();

    await enviar("V:0");

    document.getElementById("simdata").innerHTML =
      "🏁 SIMULACIÓN TERMINADA";

    return;
  }


  const punto =
    puntosSimulacion[
      indiceSimulacion
    ];


  lonActual =
    punto[0];

  latActual =
    punto[1];


  document.getElementById("simdata").innerHTML =

    "▶️ SIMULANDO" +

    "<br>Punto " +

    (indiceSimulacion + 1) +

    " / " +

    puntosSimulacion.length;


  await actualizarNavegacion();


  indiceSimulacion++;
}


/* =========================
   DETENER
========================= */

function detenerSimulacion() {

  simulando = false;


  if (timer) {

    clearInterval(timer);

    timer = null;
  }
}


/* =========================
   DISTANCIA HAVERSINE
========================= */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad =
    Math.PI / 180;


  const dLat =
    (lat2-lat1) * rad;


  const dLon =
    (lon2-lon1) * rad;


  const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*rad) *
    Math.cos(lat2*rad) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  return

    R *

    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );
}

</script>

</body>
</html>
