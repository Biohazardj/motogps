<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoGPS v14</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align:center;
  background:#111;
  color:white;
  padding:20px 12px;
}

input {
  width:88%;
  max-width:360px;
  padding:15px;
  margin:8px auto;
  font-size:17px;
  border-radius:10px;
  border:none;
  display:block;
}

button {
  display:block;
  width:92%;
  max-width:390px;
  margin:12px auto;
  padding:17px;
  font-size:17px;
  border:none;
  border-radius:12px;
  color:white;
}

#connect { background:#2196F3; }
#gps { background:#ff9800; }
#route { background:#9c27b0; }
#navigate { background:#00a86b; }
#stop { background:#d32f2f; }

#status,
#gpsdata,
#routedata,
#navdata {
  max-width:400px;
  margin:15px auto;
  line-height:1.55;
}

#gpsdata {
  color:#7CFC98;
}

#navdata {
  text-align:left;
  background:#222;
  padding:17px;
  border-radius:12px;
  font-size:17px;
}
</style>
</head>

<body>

<h1>🏍️ MotoGPS v14</h1>

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">
ESP32 desconectado
</div>

<hr>

<button id="gps" onclick="activarGPS()">
1️⃣ ACTIVAR GPS
</button>

<div id="gpsdata">
GPS desactivado
</div>

<hr>

<h2>Destino</h2>

<input
  id="destino"
  type="text"
  placeholder="Ej: Valencia de Don Juan"
>

<button id="route" onclick="calcularRuta()">
2️⃣ CALCULAR RUTA
</button>

<div id="routedata">
Sin ruta
</div>

<button id="navigate" onclick="iniciarNavegacion()">
3️⃣ ▶ INICIAR NAVEGACIÓN
</button>

<button id="stop" onclick="detenerNavegacion()">
■ DETENER
</button>

<div id="navdata">
Esperando navegación
</div>


<script>

/* =========================
   BLE
========================= */

const SERVICE_UUID =
"12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-ba0987654321";

let characteristic = null;


/* =========================
   GPS
========================= */

let watchId = null;

let latActual = null;
let lonActual = null;

let velocidadActual = 0;
let precisionActual = null;


/* =========================
   DESTINO
========================= */

let destinoActual = null;


/* =========================
   RUTA
========================= */

let pasosRuta = [];
let puntosRuta = [];
let distanciasAcumuladas = [];
let maniobras = [];

let indiceRutaActual = 0;
let indiceManiobra = 0;

let navegando = false;


/* =========================
   BLE ESTADO
========================= */

let ultimaManiobraEnviada = -1;
let ultimaDistanciaEnviada = null;
let ultimaVelocidadEnviada = null;


/* =========================
   DETECCIÓN DE DESVÍO
========================= */

let distanciaRutaActual = Infinity;

let progresoAnterior = null;
let distanciaManiobraAnterior = null;

let contadorAlejamiento = 0;

let recalculando = false;

let ultimoRecalculo = 0;

const LECTURAS_DESVIO = 3;
const DISTANCIA_FUERA_RUTA = 35;
const TIEMPO_ENTRE_RECALCULOS = 10000;


/* =========================
   BLUETOOTH
========================= */

async function conectar() {

  try {

    document.getElementById("status").innerText =
      "Buscando MotoGPS...";

    const device =
      await navigator.bluetooth.requestDevice({
        filters:[{name:"MotoGPS"}],
        optionalServices:[SERVICE_UUID]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHARACTERISTIC_UUID
      );

    document.getElementById("status").innerText =
      "✅ MotoGPS conectado";

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ " + error.message;
  }
}


/* =========================
   ENVÍO BLE
========================= */

async function enviar(texto) {

  if (!characteristic)
    return false;

  try {

    const datos =
      new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    return true;

  } catch(error) {

    document.getElementById("status").innerText =
      "❌ BLE: " + error.message;

    return false;
  }
}


function esperar(ms) {

  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}


/* =========================
   GPS
========================= */

function activarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
      "❌ GPS no disponible";

    return;
  }

  document.getElementById("gpsdata").innerText =
    "🛰️ Buscando posición...";

  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );
  }

  watchId =
    navigator.geolocation.watchPosition(

      recibirPosicion,

      errorGPS,

      {
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:15000
      }
    );
}


/* =========================
   NUEVA POSICIÓN GPS
========================= */

async function recibirPosicion(pos) {

  latActual =
    pos.coords.latitude;

  lonActual =
    pos.coords.longitude;

  precisionActual =
    pos.coords.accuracy;

  if (
    pos.coords.speed !== null &&
    Number.isFinite(pos.coords.speed)
  ) {

    velocidadActual =
      Math.max(
        0,
        Math.round(
          pos.coords.speed * 3.6
        )
      );

  } else {

    velocidadActual = 0;
  }

  document.getElementById("gpsdata").innerHTML =

    "📍 GPS ACTIVO" +

    "<br>Lat: " +
    latActual.toFixed(6) +

    "<br>Lon: " +
    lonActual.toFixed(6) +

    "<br>Precisión: " +
    Math.round(precisionActual) +
    " m" +

    "<br>Velocidad: " +
    velocidadActual +
    " km/h";

  if (
    navegando &&
    !recalculando
  ) {

    await actualizarNavegacionGPS();
  }
}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
    "❌ GPS: " + error.message;
}


/* =========================
   BUSCAR DESTINO
========================= */

async function buscarDestino(texto) {

  const url =

    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +
    "&limit=1" +
    "&countrycodes=es" +
    "&q=" +

    encodeURIComponent(texto);

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      "Error buscando destino"
    );
  }

  const datos =
    await respuesta.json();

  if (!datos.length) {

    throw new Error(
      "Destino no encontrado"
    );
  }

  return {

    lat:Number(datos[0].lat),

    lon:Number(datos[0].lon),

    nombre:
      datos[0].display_name
  };
}


/* =========================
   CALCULAR RUTA INICIAL
========================= */

async function calcularRuta() {

  if (
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    alert(
      "Primero activa el GPS."
    );

    return;
  }

  const texto =
    document
      .getElementById("destino")
      .value
      .trim();

  if (!texto) {

    alert(
      "Escribe un destino."
    );

    return;
  }

  document.getElementById("routedata").innerText =
    "🔎 Buscando destino...";

  try {

    destinoActual =
      await buscarDestino(texto);

    await generarRuta(
      false
    );

  } catch(error) {

    document.getElementById("routedata").innerHTML =

      "❌ ERROR<br>" +
      error.message;
  }
}


/* =========================
   GENERAR / RECALCULAR RUTA
========================= */

async function generarRuta(
  esRecalculo
) {

  if (!destinoActual)
    return;

  const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    lonActual + "," +
    latActual + ";" +

    destinoActual.lon + "," +
    destinoActual.lat +

    "?overview=full" +
    "&geometries=geojson" +
    "&steps=true";

  const respuesta =
    await fetch(url);

  if (!respuesta.ok) {

    throw new Error(
      "Error OSRM " +
      respuesta.status
    );
  }

  const datos =
    await respuesta.json();

  if (
    datos.code !== "Ok" ||
    !datos.routes ||
    !datos.routes.length
  ) {

    throw new Error(
      "No se pudo calcular la ruta"
    );
  }

  pasosRuta =
    datos.routes[0]
      .legs[0]
      .steps;

  const geometria =
    datos.routes[0]
      .geometry
      .coordinates;

  puntosRuta =
    densificarGeometria(
      geometria,
      5
    );

  construirDistanciasAcumuladas();

  construirIndiceManiobras();

  indiceRutaActual = 0;

  indiceManiobra = 0;

  if (
    maniobras.length > 1 &&
    maniobras[0]
      .paso
      .maneuver
      .type === "depart"
  ) {

    indiceManiobra = 1;
  }

  ultimaManiobraEnviada = -1;
  ultimaDistanciaEnviada = null;

  progresoAnterior = null;
  distanciaManiobraAnterior = null;

  contadorAlejamiento = 0;

  const distanciaKm =
    datos.routes[0].distance / 1000;

  const minutos =
    datos.routes[0].duration / 60;

  document.getElementById("routedata").innerHTML =

    (
      esRecalculo
        ? "🔄 ✅ RUTA RECALCULADA"
        : "✅ RUTA CARGADA"
    ) +

    "<br>" +

    destinoActual.nombre +

    "<br><br>Distancia: " +

    distanciaKm.toFixed(1) +
    " km" +

    "<br>Tiempo OSRM: " +

    Math.round(minutos) +
    " min" +

    "<br>Maniobras: " +

    maniobras.length +

    "<br>Puntos: " +

    puntosRuta.length;

  localizarEnRuta();

  actualizarPantallaWeb();
}


/* =========================
   DENSIFICAR
========================= */

function densificarGeometria(
  geometria,
  separacion
) {

  const resultado = [];

  for (
    let i = 0;
    i < geometria.length - 1;
    i++
  ) {

    const a = geometria[i];
    const b = geometria[i + 1];

    resultado.push(a);

    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );

    if (!Number.isFinite(d))
      continue;

    const partes =
      Math.max(
        1,
        Math.ceil(
          d / separacion
        )
      );

    for (
      let j = 1;
      j < partes;
      j++
    ) {

      const t =
        j / partes;

      resultado.push([

        a[0] +
        (b[0] - a[0]) * t,

        a[1] +
        (b[1] - a[1]) * t

      ]);
    }
  }

  if (geometria.length) {

    resultado.push(
      geometria[
        geometria.length - 1
      ]
    );
  }

  return resultado;
}


/* =========================
   DISTANCIAS ACUMULADAS
========================= */

function construirDistanciasAcumuladas() {

  distanciasAcumuladas = [];

  if (!puntosRuta.length)
    return;

  distanciasAcumuladas[0] = 0;

  for (
    let i = 1;
    i < puntosRuta.length;
    i++
  ) {

    const a =
      puntosRuta[i - 1];

    const b =
      puntosRuta[i];

    const d =
      distanciaMetros(
        a[1],
        a[0],
        b[1],
        b[0]
      );

    distanciasAcumuladas[i] =

      distanciasAcumuladas[i - 1] +

      (
        Number.isFinite(d)
          ? d
          : 0
      );
  }
}


/* =========================
   INDEXAR MANIOBRAS
========================= */

function construirIndiceManiobras() {

  maniobras = [];

  let indiceBusqueda = 0;

  for (
    let p = 0;
    p < pasosRuta.length;
    p++
  ) {

    const paso =
      pasosRuta[p];

    const lon =
      paso.maneuver.location[0];

    const lat =
      paso.maneuver.location[1];

    let mejorIndice =
      indiceBusqueda;

    let mejorDistancia =
      Infinity;

    for (
      let i = indiceBusqueda;
      i < puntosRuta.length;
      i++
    ) {

      const punto =
        puntosRuta[i];

      const d =
        distanciaMetros(
          lat,
          lon,
          punto[1],
          punto[0]
        );

      if (
        Number.isFinite(d) &&
        d < mejorDistancia
      ) {

        mejorDistancia = d;
        mejorIndice = i;
      }

      if (mejorDistancia < 2)
        break;
    }

    maniobras.push({

      paso:paso,

      indicePunto:
        mejorIndice
    });

    indiceBusqueda =
      mejorIndice;
  }
}


/* =========================
   LOCALIZAR GPS EN RUTA
========================= */

function localizarEnRuta() {

  if (
    !puntosRuta.length ||
    !Number.isFinite(latActual) ||
    !Number.isFinite(lonActual)
  ) {

    return null;
  }

  let inicio =
    Math.max(
      0,
      indiceRutaActual - 40
    );

  let fin =
    Math.min(
      puntosRuta.length - 1,
      indiceRutaActual + 300
    );

  if (indiceRutaActual === 0) {

    inicio = 0;

    fin =
      puntosRuta.length - 1;
  }

  let mejorIndice =
    indiceRutaActual;

  let mejorDistancia =
    Infinity;

  for (
    let i = inicio;
    i <= fin;
    i++
  ) {

    const punto =
      puntosRuta[i];

    const d =
      distanciaMetros(
        latActual,
        lonActual,
        punto[1],
        punto[0]
      );

    if (
      Number.isFinite(d) &&
      d < mejorDistancia
    ) {

      mejorDistancia = d;
      mejorIndice = i;
    }
  }

  if (
    mejorIndice >=
    indiceRutaActual - 8
  ) {

    indiceRutaActual =
      Math.max(
        0,
        mejorIndice
      );
  }

  distanciaRutaActual =
    mejorDistancia;

  return {

    indice:
      indiceRutaActual,

    distancia:
      mejorDistancia
  };
}


/* =========================
   MANIOBRA ACTUAL
========================= */

function actualizarIndiceManiobra() {

  while (
    indiceManiobra <
      maniobras.length - 1 &&

    indiceRutaActual >=
      maniobras[
        indiceManiobra
      ].indicePunto
  ) {

    indiceManiobra++;
  }
}


/* =========================
   DISTANCIA HASTA MANIOBRA
========================= */

function distanciaHastaManiobra(
  desde,
  hasta
) {

  if (
    desde < 0 ||
    hasta < 0 ||
    desde >= puntosRuta.length ||
    hasta >= puntosRuta.length
  ) {

    return 0;
  }

  if (hasta <= desde)
    return 0;

  if (
    distanciasAcumuladas.length ===
    puntosRuta.length
  ) {

    return Math.max(

      0,

      distanciasAcumuladas[hasta] -
      distanciasAcumuladas[desde]
    );
  }

  return 0;
}


/* =========================
   MANIOBRA BLE
========================= */

function comandoManiobra(paso) {

  const mod =
    paso.maneuver.modifier || "";

  const tipo =
    paso.maneuver.type || "";

  if (mod.includes("uturn"))
    return "T:UTURN";

  if (mod.includes("right"))
    return "T:RIGHT";

  if (mod.includes("left"))
    return "T:LEFT";

  if (
    mod.includes("straight") ||
    tipo === "continue" ||
    tipo === "depart"
  ) {

    return "T:STRAIGHT";
  }

  return "T:STRAIGHT";
}


/* =========================
   DETECTAR DESVÍO
========================= */

async function comprobarDesvio(
  metrosManiobra
) {

  if (velocidadActual < 2) {

    contadorAlejamiento = 0;

    progresoAnterior =
      indiceRutaActual;

    distanciaManiobraAnterior =
      metrosManiobra;

    return;
  }

  let sospechoso = false;


  /*
   CASO 1:
   lejos de la ruta.
  */

  if (
    distanciaRutaActual >
    DISTANCIA_FUERA_RUTA
  ) {

    sospechoso = true;
  }


  /*
   CASO 2:
   nos alejamos de la
   siguiente maniobra.
  */

  if (
    distanciaManiobraAnterior !== null &&
    metrosManiobra >
      distanciaManiobraAnterior + 3
  ) {

    sospechoso = true;
  }


  /*
   CASO 3:
   nos movemos pero no
   progresamos por la ruta.
  */

  if (
    progresoAnterior !== null &&
    indiceRutaActual <=
      progresoAnterior &&
    velocidadActual >= 3
  ) {

    sospechoso = true;
  }


  if (sospechoso) {

    contadorAlejamiento++;

  } else {

    contadorAlejamiento = 0;
  }


  progresoAnterior =
    indiceRutaActual;

  distanciaManiobraAnterior =
    metrosManiobra;


  if (
    contadorAlejamiento >=
    LECTURAS_DESVIO
  ) {

    await recalcularRuta();
  }
}


/* =========================
   RECALCULAR
========================= */

async function recalcularRuta() {

  if (
    recalculando ||
    !destinoActual
  ) {

    return;
  }

  const ahora =
    Date.now();

  if (
    ahora - ultimoRecalculo <
    TIEMPO_ENTRE_RECALCULOS
  ) {

    return;
  }

  recalculando = true;

  ultimoRecalculo = ahora;

  contadorAlejamiento = 0;

  document.getElementById(
    "navdata"
  ).innerHTML =

    "🔄 <b>RECALCULANDO RUTA...</b>" +

    "<br><br>Nueva posición GPS:" +

    "<br>" +
    latActual.toFixed(6) +

    "<br>" +
    lonActual.toFixed(6);

  try {

    await generarRuta(
      true
    );

    ultimaManiobraEnviada = -1;
    ultimaDistanciaEnviada = null;

  } catch(error) {

    document.getElementById(
      "navdata"
    ).innerHTML =

      "❌ Error recalculando" +

      "<br>" +
      error.message;

  } finally {

    recalculando = false;
  }

  if (navegando) {

    await actualizarNavegacionGPS();
  }
}


/* =========================
   ACTUALIZAR NAVEGACIÓN
========================= */

async function actualizarNavegacionGPS() {

  if (
    !navegando ||
    !maniobras.length ||
    recalculando
  ) {

    return;
  }

  const localizacion =
    localizarEnRuta();

  if (!localizacion)
    return;

  actualizarIndiceManiobra();

  const actual =
    maniobras[
      indiceManiobra
    ];

  if (!actual)
    return;

  let distancia =
    distanciaHastaManiobra(

      indiceRutaActual,

      actual.indicePunto
    );

  if (!Number.isFinite(distancia)) {

    distancia = 0;
  }

  const metros =
    Math.max(
      0,
      Math.round(distancia)
    );

  await comprobarDesvio(
    metros
  );

  if (recalculando)
    return;

  const comando =
    comandoManiobra(
      actual.paso
    );

  const calle =
    actual.paso.name ||
    "Sin nombre";


  /* FLECHA + CALLE */

  if (
    indiceManiobra !==
    ultimaManiobraEnviada
  ) {

    await enviar(
      comando
    );

    await esperar(70);

    await enviar(
      "C:" + calle
    );

    ultimaManiobraEnviada =
      indiceManiobra;
  }


  /* DISTANCIA */

  if (
    ultimaDistanciaEnviada === null ||
    Math.abs(
      metros -
      ultimaDistanciaEnviada
    ) >= 5
  ) {

    await esperar(40);

    await enviar(
      "D:" +
      metros +
      " m"
    );

    ultimaDistanciaEnviada =
      metros;
  }


  /* VELOCIDAD */

  if (
    ultimaVelocidadEnviada === null ||
    velocidadActual !==
      ultimaVelocidadEnviada
  ) {

    await esperar(40);

    await enviar(
      "V:" +
      velocidadActual
    );

    ultimaVelocidadEnviada =
      velocidadActual;
  }

  actualizarPantallaWeb(
    localizacion.distancia
  );
}


/* =========================
   PANTALLA WEB
========================= */

function actualizarPantallaWeb(
  distanciaRuta = null
) {

  if (!maniobras.length)
    return;

  actualizarIndiceManiobra();

  const actual =
    maniobras[
      indiceManiobra
    ];

  if (!actual)
    return;

  const distancia =
    distanciaHastaManiobra(

      indiceRutaActual,

      actual.indicePunto
    );

  const metros =
    Number.isFinite(distancia)
      ? Math.round(distancia)
      : 0;

  let texto =

    "🧭 <b>MANIOBRA " +

    (indiceManiobra + 1) +

    " / " +

    maniobras.length +

    "</b>" +

    "<br><br>" +

    comandoManiobra(
      actual.paso
    ) +

    "<br>" +

    (
      actual.paso.name ||
      "Sin nombre"
    ) +

    "<br><br>📏 <b>" +

    metros +

    " m</b>" +

    "<br>🛣 Punto ruta: " +

    indiceRutaActual +

    " / " +

    puntosRuta.length;

  if (
    Number.isFinite(
      distanciaRuta
    )
  ) {

    texto +=

      "<br>📡 Distancia GPS a ruta: " +

      Math.round(
        distanciaRuta
      ) +

      " m";
  }

  texto +=

    "<br>⚠️ Desvío: " +

    contadorAlejamiento +

    " / " +

    LECTURAS_DESVIO;

  document.getElementById(
    "navdata"
  ).innerHTML = texto;
}


/* =========================
   INICIAR
========================= */

async function iniciarNavegacion() {

  if (!puntosRuta.length) {

    alert(
      "Primero calcula una ruta."
    );

    return;
  }

  navegando = true;

  contadorAlejamiento = 0;

  progresoAnterior = null;
  distanciaManiobraAnterior = null;

  ultimaManiobraEnviada = -1;
  ultimaDistanciaEnviada = null;
  ultimaVelocidadEnviada = null;

  await actualizarNavegacionGPS();
}


/* =========================
   DETENER
========================= */

async function detenerNavegacion() {

  navegando = false;

  contadorAlejamiento = 0;

  await enviar(
    "V:0"
  );

  document.getElementById(
    "navdata"
  ).innerHTML =

    "⏹ Navegación detenida";
}


/* =========================
   HAVERSINE
========================= */

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  if (
    !Number.isFinite(lat1) ||
    !Number.isFinite(lon1) ||
    !Number.isFinite(lat2) ||
    !Number.isFinite(lon2)
  ) {

    return Infinity;
  }

  const R =
    6371000;

  const rad =
    Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;

  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +

    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c =

    2 *

    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}
