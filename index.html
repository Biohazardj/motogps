<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoGPS</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #111;
  color: white;
  padding: 25px 15px;
}

button, input {
  display: block;
  width: 90%;
  max-width: 350px;
  margin: 15px auto;
  padding: 17px;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  box-sizing: border-box;
}

input {
  background: white;
  color: black;
}

#connect {
  background: #2196F3;
  color: white;
}

#gps {
  background: #ff9800;
  color: white;
}

#route {
  background: #9c27b0;
  color: white;
}

.send {
  background: #4CAF50;
  color: white;
}

#status,
#gpsdata,
#rutadata {
  margin: 20px auto;
  line-height: 1.6;
  font-size: 17px;
  max-width: 400px;
}

#rutadata {
  text-align: left;
  background: #222;
  padding: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>MotoGPS</h1>

<!-- BLUETOOTH -->

<button id="connect" onclick="conectar()">
CONECTAR MOTOGPS
</button>

<div id="status">
Desconectado
</div>

<!-- GPS -->

<button id="gps" onclick="iniciarGPS()">
ACTIVAR GPS
</button>

<div id="gpsdata">
GPS desactivado
</div>

<hr>

<!-- NAVEGACIÓN -->

<h2>Navegación</h2>

<input
id="destino"
type="text"
placeholder="Ej: Catedral de León">

<button id="route" onclick="calcularRuta()">
CALCULAR RUTA
</button>

<div id="rutadata">
Sin ruta
</div>

<!-- PRUEBAS MANUALES -->

<button class="send" onclick="enviar('T:RIGHT')">
ENVIAR T:RIGHT
</button>

<button class="send" onclick="enviar('T:LEFT')">
ENVIAR T:LEFT
</button>


<script>

const SERVICE_UUID =
'12345678-1234-1234-1234-1234567890ab';

const CHARACTERISTIC_UUID =
'87654321-4321-4321-4321-ba0987654321';

let characteristic;

let latActual = null;
let lonActual = null;


/* =========================
   BLUETOOTH
========================= */

async function conectar() {

  try {

    document.getElementById("status").innerText =
    "Buscando MotoGPS...";

    const device =
    await navigator.bluetooth.requestDevice({
      filters: [
        { name: 'MotoGPS' }
      ],
      optionalServices: [
        SERVICE_UUID
      ]
    });

    const server =
    await device.gatt.connect();

    const service =
    await server.getPrimaryService(
      SERVICE_UUID
    );

    characteristic =
    await service.getCharacteristic(
      CHARACTERISTIC_UUID
    );

    document.getElementById("status").innerText =
    "✅ MotoGPS conectado";

  }

  catch(error) {

    document.getElementById("status").innerText =
    "❌ " + error;

  }

}


/* =========================
   ENVIAR BLE
========================= */

async function enviar(texto) {

  if (!characteristic) {

    document.getElementById("status").innerText =
    "Primero conecta MotoGPS";

    return;
  }

  try {

    const datos =
    new TextEncoder().encode(texto);

    await characteristic.writeValue(datos);

    document.getElementById("status").innerText =
    "Enviado: " + texto;

  }

  catch(error) {

    document.getElementById("status").innerText =
    "❌ " + error;

  }

}


/* =========================
   GPS
========================= */

function iniciarGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gpsdata").innerText =
    "Este navegador no permite GPS";

    return;
  }

  document.getElementById("gpsdata").innerText =
  "Buscando posición...";

  navigator.geolocation.watchPosition(
    actualizarGPS,
    errorGPS,
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );

}


function actualizarGPS(pos) {

  latActual =
  pos.coords.latitude;

  lonActual =
  pos.coords.longitude;

  const lat =
  latActual.toFixed(6);

  const lon =
  lonActual.toFixed(6);

  const precision =
  Math.round(
    pos.coords.accuracy
  );

  let velocidad = 0;

  if (pos.coords.speed !== null) {

    velocidad =
    Math.round(
      pos.coords.speed * 3.6
    );

  }

  document.getElementById("gpsdata").innerHTML =

  "📍 Latitud: " + lat +

  "<br>📍 Longitud: " + lon +

  "<br>🎯 Precisión: " + precision + " m" +

  "<br>🏍️ Velocidad: " + velocidad + " km/h";

}


function errorGPS(error) {

  document.getElementById("gpsdata").innerText =
  "❌ Error GPS: " + error.message;

}


/* =========================
   BUSCAR DESTINO
========================= */

async function buscarDestino(texto) {

  const url =
  "https://nominatim.openstreetmap.org/search" +
  "?format=json" +
  "&limit=1" +
  "&countrycodes=es" +
  "&q=" +
  encodeURIComponent(texto);

  const respuesta =
  await fetch(url);

  const datos =
  await respuesta.json();

  if (datos.length === 0) {

    throw new Error(
      "Destino no encontrado"
    );

  }

  return {

    lat:
    parseFloat(datos[0].lat),

    lon:
    parseFloat(datos[0].lon),

    nombre:
    datos[0].display_name

  };

}


/* =========================
   CALCULAR RUTA
========================= */

async function calcularRuta() {

  const salida =
  document.getElementById("rutadata");

  try {

    if (
      latActual === null ||
      lonActual === null
    ) {

      salida.innerHTML =
      "❌ Primero activa el GPS";

      return;
    }

    const texto =
    document
    .getElementById("destino")
    .value
    .trim();

    if (!texto) {

      salida.innerHTML =
      "❌ Escribe un destino";

      return;
    }

    salida.innerHTML =
    "🔎 Buscando destino...";

    const destino =
    await buscarDestino(texto);

    salida.innerHTML =
    "🗺️ Calculando ruta...";


    const url =

    "https://router.project-osrm.org/route/v1/driving/" +

    lonActual + "," +
    latActual + ";" +

    destino.lon + "," +
    destino.lat +

    "?overview=false&steps=true";


    const respuesta =
    await fetch(url);

    const datos =
    await respuesta.json();


    if (
      datos.code !== "Ok" ||
      !datos.routes ||
      datos.routes.length === 0
    ) {

      throw new Error(
        "No se pudo calcular la ruta"
      );

    }


    const ruta =
    datos.routes[0];

    const pasos =
    ruta.legs[0].steps;


    let html = "";


    html +=
    "<b>Destino:</b><br>" +
    destino.nombre +
    "<br><br>";


    html +=
    "<b>Distancia total:</b> " +
    (ruta.distance / 1000).toFixed(1) +
    " km<br>";


    html +=
    "<b>Tiempo aproximado:</b> " +
    Math.round(ruta.duration / 60) +
    " min";


    html +=
    "<hr>";


    html +=
    "<b>Primeras maniobras:</b><br><br>";


    pasos.slice(0, 8).forEach(
      function(paso, indice) {

        const tipo =
        paso.maneuver.type;

        const modificador =
        paso.maneuver.modifier || "";

        const calle =
        paso.name || "Sin nombre";

        const distancia =
        Math.round(paso.distance);

        html +=

        (indice + 1) +
        ". " +

        "<b>" +
        tipo +
        " " +
        modificador +
        "</b>" +

        "<br>" +

        calle +

        "<br>" +

        distancia +
        " m" +

        "<br><br>";

      }
    );


    /* =========================
       ENVIAR PRIMERA MANIOBRA
       AUTOMÁTICAMENTE
    ========================= */

    if (pasos.length > 0 && characteristic) {

      const maniobra =
      pasos[0].maneuver;

      const tipo =
      maniobra.type || "";

      const modificador =
      maniobra.modifier || "";

      let comando = "";


      if (
        modificador.includes("right")
      ) {

        comando =
        "T:RIGHT";

      }

      else if (
        modificador.includes("left")
      ) {

        comando =
        "T:LEFT";

      }

      else if (
        modificador.includes("straight") ||
        tipo === "continue"
      ) {

        comando =
        "T:STRAIGHT";

      }

      else if (
        modificador.includes("uturn")
      ) {

        comando =
        "T:UTURN";

      }


      if (comando !== "") {

        await enviar(comando);

        html +=
        "<hr>" +
        "📡 <b>Enviado a MotoGPS:</b> " +
        comando;

      }

    }


    salida.innerHTML =
    html;

  }

  catch(error) {

    salida.innerHTML =
    "❌ " + error.message;

  }

}

</script>

</body>
</html>
